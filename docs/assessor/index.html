.app-signin .card-lang { width: 100%; max-width: 34rem; margin: 1rem auto 0; text-align: left; }
/* The way into the demonstration, under the sign-in card. Quieter than anything in the card,
   because the card is what most people on this screen came for. */
.signin-demo {
  max-width: 34rem;
  margin: 1.1rem auto 0;
  text-align: left;
  font-size: .85rem;
  color: var(--muted);
  line-height: 1.5;
}
/* On its own line. A person who has no account is scanning for the way out of this screen,
   and at the end of a wrapped sentence is where it is hardest to find. */
.signin-demo a { color: var(--accent); }
.card-lang .lang-link { color: var(--accent); }

/* The assessor's score row. The same eleven buttons the submitter picks from, because an
   assessor disagreeing with a rung should be choosing a rung and not typing an integer into a
   spinner. The department's own pick is ringed, so the two readings are visible at once. */
.audit-controls { display: grid; gap: .5rem; }
.audit-line { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.audit-label { min-width: 5.2rem; color: var(--ink-2); }
.audit-score { display: flex; gap: .2rem; flex-wrap: wrap; }
.audit-score .score-btn.theirs { box-shadow: 0 0 0 2px var(--line-2) inset; }
.audit-score .audit-clear { width: auto; padding: 0 .5rem; font-size: .78rem; }
/* One judgement, pressed or not, where there was a dropdown of four. */
.verdict-toggle { background: none; border: 1px solid var(--line); color: var(--ink-2);
  border-radius: var(--radius-sm); padding: .3rem .6rem; font-size: .83rem; cursor: pointer;
  white-space: nowrap; }
.verdict-toggle:hover { border-color: var(--line-2); color: var(--ink); }
.verdict-toggle.on { background: var(--warn-bg); border-color: var(--warn); color: var(--warn);
  font-weight: 600; }
.verdict-agreed { background: none; border: 1px solid var(--line); color: var(--ink-3);
  border-radius: var(--radius-sm); padding: .3rem .5rem; font-size: .78rem; cursor: pointer;
  white-space: nowrap; }
.verdict-agreed:hover { color: var(--ink-2); border-color: var(--line-2); }

/* One heading per section, and it is the control that opens the fold, so it takes the
   summary's box and keeps only the separating rule from the heading it replaced. */
summary.section-head { margin: 0; padding: .55rem .1rem .5rem;
  border-bottom: 1px solid var(--line); }
summary.section-head .section-title { flex: 0 1 auto; }
summary.section-head .sec-right { margin-left: auto; display: flex; align-items: baseline;
  gap: .45rem; }
summary.section-head .sec-weight { white-space: nowrap; }
summary.section-head button { margin-left: 0; }
.audit-delta { margin-left: .2rem; }
.audit-line select, .audit-line input[type="text"] { min-width: 10rem; }
.audit-line input[type="text"] { flex: 1 1 14rem; }

/* One rail per question, not two.
   A flagged question drew its own rail and the finding inside it drew a second one directly
   beside it, so every flagged question arrived with a pair of coloured lines down its left and
   nothing saying they meant different things. Reported as: it has the red line for each
   question twice, it is confusing. The finding keeps its severity on its dot and its title,
   which is where it was already carried. */
.audit-row .flag { border-left: 0; padding-left: 0; background: transparent; }
.audit-row .flag .flag-title { color: var(--sev); }

/* The door to the full submission, where a fold holding 150 questions used to be. */
.rest-door { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  flex-wrap: wrap; }
.rest-door h2 { margin: 0 0 .2rem; }
.full-section { margin: .4rem 0; }

/* The door into the assessment: a block you press, directly under the summary of the thing
   being assessed. It is a button that looks like a card on purpose, because the thing it does
   is open a screen and not submit a form. */
.assess-door { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  width: 100%; text-align: left; cursor: pointer; border: 1px solid var(--accent-line);
  background: var(--surface); }
.assess-door:hover { border-color: var(--accent); background: var(--surface-2); }
.assess-door h2 { margin: 0 0 .15rem; color: var(--accent); }
.assess-go { font-size: 1.6rem; color: var(--accent); line-height: 1; }
.assess-tabs { display: flex; gap: .3rem; }
.assess-tabs .tab { padding: .4rem .8rem; border-radius: var(--radius-sm); background: none;
  border: 1px solid transparent; color: var(--ink-2); cursor: pointer; }
.assess-tabs .tab.on { background: var(--surface-2); border-color: var(--line);
  color: var(--ink); font-weight: 600; }

/*
 * TAKEN OUT ON 20 OCTOBER 2026 WITH THE ALL TAB, which was the only place they drew.
 *
 * Ready work, then drafts, then withdrawn records, each under a heading saying what it is. A
 * band describes a group WITHIN a list, so on any tab but All there was one group and the band
 * was a heading over the whole thing saying what the tab already said. The tab carries the name
 * and the count now.
 *
 * .triage tbody tr.group-band td { border-top: 2px solid var(--line-2); background: var(--surface-2);
 *   padding: .45rem .55rem; font-size: .76rem; text-transform: uppercase; letter-spacing: .05em;
 *   font-weight: 650; color: var(--ink-2); }
 * .triage tbody tr.group-band:first-child td { border-top: 0; }
 * .triage tbody tr.group-band:hover td { background: var(--surface-2); }
 * .triage tbody tr.group-band .band-count { display: inline-block; margin-left: .45rem;
 *   padding: 0 .35rem; border-radius: var(--radius-sm); background: var(--surface);
 *   border: 1px solid var(--line); font-family: var(--mono); letter-spacing: 0; }
 */
/**
 * A DRAFT LOOKS LIKE A DRAFT BEFORE ANYBODY READS A WORD OF IT.
 *
 * The tab says which rows these are, and the word Draft is in the State column, and both of
 * those have to be read. Asked for in those terms: I should be able to look at it and tell you
 * those are drafts without reading the note.
 *
 * Two signals, both borrowed rather than invented.
 *
 * The dashed edge, where finished rows have a solid one. Dashed means provisional everywhere
 * it is used - a placeholder frame in a design tool, a proposed boundary on a plan, a cut line
 * that is not a cut yet. It is the only dashed thing on the screen.
 *
 * And no score colour. A tracker says not-started with a hollow circle and started with a
 * filled one, and the colour on a row here is its score: a draft's score is a number taken
 * before the department had finished answering, so it is shown in plain ink rather than in the
 * red-to-green that invites somebody to read it as a finding. The number is still there, and
 * it goes back to full colour the moment the submitter marks the assessment ready.
 */
.triage tbody tr.row-draft td { color: var(--ink-2); }
.triage tbody tr.row-draft td:first-child {
  border-left: 2px dashed var(--line-2); padding-left: .5rem; }
.triage tbody tr.row-draft td.num,
.triage tbody tr.row-draft .pill, .triage tbody tr.row-draft .bar-num { color: var(--ink-3); }
/* Out of every number on the portfolio, and it should not read as live work. */
.triage tbody tr.row-withdrawn td { opacity: .62; }
/* Where you are, as a path. */
/* A path, not a panel. It sits above the page the way a breadcrumb does everywhere else, on
   one baseline, with the current place in plain weight rather than shouting. */
.crumbs { display: flex; align-items: baseline; gap: .4rem; font-size: .85rem;
  padding: 0; border: 0; background: none; box-shadow: none; }
.crumbs .linkish { font-size: inherit; line-height: 1.2; padding: 0; color: var(--ink-3); }
.crumbs .linkish:hover { color: var(--accent); }
.crumb-sep { color: var(--ink-3); line-height: 1.2; }
.crumb-here { color: var(--ink-2); line-height: 1.2; }
/* Who has audited this, above everything else on the submission. */
/* Who has touched this, as a byline under the title rather than a block of its own. */
.byline { display: flex; align-items: center; gap: .45rem; margin: .35rem 0 0;
  font-size: .85rem; color: var(--ink-2); }
.byline .faces { display: inline-flex; }
.byline .face { width: 1.5rem; height: 1.5rem; border-radius: 999px; display: inline-flex;
  align-items: center; justify-content: center; font-size: .64rem; font-weight: 700;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line);
  margin-left: -.35rem; }
.byline .face:first-child { margin-left: 0; }
.byline .face.mine { background: var(--accent); color: #fff; border-color: var(--accent); }
.byline.none-yet { color: var(--ink-3); }
.count-beside { font-weight: 400; }

/* A score beside a heading is a separate thing from the heading, and it was touching it. */
.body-review h2 > .pill, .body-admin h2 > .pill { margin-left: .6rem; vertical-align: .05em; }

/* The same initials on a question as on the byline, so the mark means one thing. */
.q-faces { margin-left: auto; }
.q-faces .face { width: 1.3rem; height: 1.3rem; font-size: .58rem; }

/* The one tool question, in the dialog that marks an assessment ready. It sits under the two
   signer fields and is the quieter of the two things in there, because the signer is required
   and this is not. */
.ready-fields { display: grid; gap: .7rem; }
.took-row { display: grid; gap: .25rem; font-size: .86rem; color: var(--ink-2); }
.took-row select { width: 100%; }
</style>
