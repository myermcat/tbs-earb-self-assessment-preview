 * The assessor's column is wider than the submitter's, because what it holds is different.
 *
 * The submitter reads prose, and 940px is a reading measure. The assessor reads a twelve-column
 * table of every submission, and at 940px that table could not fit: it overflowed its box by
 * 309px and turned into a sideways scroll, reported as "the preview is longer horizontally than
 * the box given for it". 1200px is the width the questionnaire already uses, so this is not a
 * new number, and the three declarations under it take the table's own floor from 1173px to
 * 413px so it fits here and on a 1024px laptop.
 */
/**
 * The assessor's page is one width, whatever is on it.
 *
 * Reported as: flagged questions spans the screen, all questions does not, and opening a
 * section makes the block wider. All three are the same thing. The shell is a column flex and
 * this element centres itself with auto side margins, and an auto margin on the cross axis
 * turns stretching off: the page was sized to its own content and every change of content
 * changed its width. An explicit width under the cap centres a box of a fixed size instead.
 */
.body-review, .body-admin { padding-bottom: .4rem; width: 100%; max-width: min(1200px, 100%); }
/* A badge that cannot wrap is a column that cannot shrink. */
/**
 * The declared widths are binding, and the table has a floor.
 *
 * Without `table-layout: fixed` a colgroup is advice: a browser widens any column whose
 * content wants more, taking it from the others, and the column that loses is the one with the
 * least content - which here was the row menu, the only way to anything a row can do.
 *
 * The floor is what keeps fixed from being worse than the problem. Fixed plus width 100% means
 * the table never exceeds its container, so it would never scroll and would squeeze thirteen
 * columns into a phone instead. 70rem is the twelve declared widths plus room for an
 * initiative's name, and it is under the 1124px the card holds at its widest - the page caps
 * its content at 1200px, so no monitor makes this table roomier. Below 70rem the wrapper
 * scrolls, which is what it is for.
 */
.triage { table-layout: fixed; min-width: 70rem; }
/**
 * THE ROW MENU IS PINNED TO THE RIGHT EDGE AND NEVER SCROLLS AWAY.
 *
 * Thirteen columns do not fit a thousand-pixel window, and narrowing them far enough to make
 * them fit would leave an initiative's name in four words a line. So the table scrolls, which
 * is the right answer for twelve of the columns and the wrong one for the thirteenth: the menu
 * is the only way to anything a row can do, and the one thing nobody should have to go looking
 * for. Reported twice, the second time after the widths were corrected: my dots are still
 * outside the screen.
 *
 * It sticks to the right of the scrolling box, so it is on screen at every width with the rest
 * of the row sliding under it. The background is the card's, because a transparent sticky cell
 * shows whatever is passing beneath it.
 */
.triage th:last-child, .triage td:last-child {
  position: sticky; right: 0; z-index: 1;
  background: var(--surface);
  /**
   * The hairline is a shadow and not a border, because the table collapses its borders and a
   * collapsed border belongs to the grid rather than to the cell - it stays where the column
   * was and the cell slides out from under it. An inset shadow is painted by the cell itself,
   * so it travels. The second shadow is the shade that tells a reader the column is in front
   * of the row rather than part of it; it only shows while there is something behind it.
   */
  /**
   * The shade and no hairline. Asked for: remove the vertical line.
   *
   * There were two marks here doing one job. The line said the column is separate, and the
   * shade says it is in front of the row sliding under it, which is the true thing and the only
   * one that disappears when there is nothing behind it to be in front of.
   */
  box-shadow: -6px 0 6px -6px rgb(0 0 0 / .16);
}
.triage tbody tr:hover td:last-child { background: var(--accent-soft); }
/* Nothing is behind it once the table fits, so the shade comes off and nothing marks it. */
@media (min-width: 1240px) {
  .body-review .triage th:last-child, .body-review .triage td:last-child,
  .body-admin .triage th:last-child, .body-admin .triage td:last-child {
    box-shadow: none; }
}
.triage .badge { white-space: normal; margin-left: 0;
  /* The cells below break anywhere, because a department name has to fit a narrow column. A
     badge is one or two short words and must not: Ready broke after Read and the y went to a
     second line, which turned a chip into a circle with a letter in it. */
  overflow-wrap: normal; word-break: keep-all; }
/**
 * A cell breaks a word only when the word cannot fit at all.
 *
 * `anywhere` lets the browser break wherever it likes the moment a line is tight, which is how
 * Unclassified arrived as Unclassifi and ed. `break-word` keeps that as a last resort for a
 * word genuinely wider than its column, and the table already has a sideways scroller for the
 * case where everything else is too wide. Asked: what else can we do then. This.
 */
.triage td { overflow-wrap: break-word; }
/* A qualifier under a column heading, for a word that would otherwise read as the tool's own
   finding: State is what the department said about itself. */
/* A sortable heading is a control and says so on hover, without becoming a button-looking
   thing in a row of plain words. The arrow only appears on the column actually in force. */
.triage th.sortable { cursor: pointer; user-select: none; }
.triage th.sortable:hover, .triage th.sortable:focus-visible { color: var(--ink); }
.triage th.sortable:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.triage th.sorted { color: var(--ink); }
.triage th .sort-mark { margin-left: .2rem; font-family: var(--mono); font-weight: 400; }

/* A heading may wrap onto two lines. A button in a cell may not: "Open" broke in half. */
.triage th { white-space: normal; line-height: 1.15; vertical-align: bottom; }

/* ---- a note on a column heading -------------------------------------------------------- *
 *
 * Drawn here rather than left to the browser's title tooltip, which waits a second, shows
 * nothing on a touch screen, and cannot be reached from the keyboard.
 *
 * The dotted underline is the only sign a heading has a note at all. Without it a reader has
 * to hover every column to find out, which is the same as not having one.
 *
 * Fixed, not absolute: the table scrolls sideways on a narrow screen and a note inside that
 * scroller is cut off at its edge. views-review.ts sets left and top when it opens.
 */
th.has-note { position: relative; cursor: help; }
th.has-note .note-word { border-bottom: 1px dotted var(--line-2); }
th.has-note:hover .note-word,
th.has-note:focus-visible .note-word { border-bottom-color: var(--accent); }
th.has-note:focus { outline: none; }
th.has-note:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.note-pop {
  position: fixed; left: 0; top: 0; z-index: 60;
  width: 15rem; max-width: calc(100vw - 1rem);
  /* A heading is uppercase and letter-spaced; a sentence read at that size is not. */
  font-weight: 400; font-size: .76rem; line-height: 1.4;
  /* pre-line, so a note can put a second fact on its own line and still wrap within each. */
  text-transform: none; letter-spacing: 0; text-align: left; white-space: pre-line;
  color: var(--surface); background: var(--ink);
  padding: .45rem .55rem; border-radius: 6px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .22);
  opacity: 0; visibility: hidden; transition: opacity .12s ease;
  pointer-events: none;
}
.note-pop.on { opacity: 1; visibility: visible; }

@media (prefers-reduced-motion: reduce) { .note-pop { transition: none; } }
/* Printing a tooltip prints a black box over the row under it. */
@media print { .note-pop { display: none; } }
.triage .row-acts { display: flex; gap: .3rem; align-items: center; justify-content: flex-end; }
.triage .row-acts button { white-space: nowrap; }
/* A tag sitting against the word beside it reads as part of it. */
.triage .tag { display: inline-block; margin-top: .22rem; }
.triage td:first-child .tag { margin-left: .4rem; }
/* Only the bottom margin is reset. `> section` outranks `> * + *`, so resetting all four
   sides here silently cancelled the gap below, which is how the first version of this measured
   0px between two cards. */
.body-review > section, .body-admin > section { margin-bottom: 0; }
.body-review > * + *, .body-admin > * + * { margin-top: 2.9rem; }
.body-review > .card.warn + * { margin-top: 1.9rem; }

/**
 * A control group carries its own distance from what is above it.
 *
 * .actions had no top margin at all, so its gap was whatever the element above happened to
 * leave: zero after a table, zero after every heading, 8px after one paragraph, 12px after a
 * field. On both list screens the export button's own border was touching the table's closing
 * rule at 0px while being 8px from the button beside it, which puts a control closer to
 * content it has nothing to do with than to its own group.
 */
.body-review .card > .actions, .body-admin .card > .actions,
.body-review .card > .field + .actions, .body-admin .card > .field + .actions,
.res-region > .actions, .res-sub > .actions { margin-top: 1.15rem; }

/* A heading with zero space under it is a heading that has joined its own content. */
.body-review h2 + *, .body-admin h2 + *,
.body-review h1 + *, .body-admin h1 + * { margin-top: .5rem; }
.body-review .card > h2, .body-admin .card > h2 { margin-bottom: 0; }

/* The controls that belong to a table go above it, where they read as its toolbar. */
.res-toolbar { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
  margin: .85rem 0 .7rem; }
.res-toolbar .spacer { flex: 1 1 auto; }
.btn-icon { display: inline-flex; align-items: center; gap: .4rem; }
.btn-icon svg { flex: none; }
.menu-sep { height: 1px; background: var(--line); margin: .3rem 0; }
/* Open, and a menu beside it. The menu is where anything that removes a row goes. */
.row-acts { display: flex; align-items: center; gap: .35rem; justify-content: flex-end; }

/* ---------- the access code ---------------------------------------------------------------
 * One box per character, three groups of four, the way a verification code is typed. The
 * dashes are drawn and never typed.
 * ------------------------------------------------------------------------------------------ */
/* One line, at every width. The boxes share whatever room there is and stop growing at a
   comfortable size, so twelve of them never wrap and the three groups stay a shape somebody
   can match against the message they were sent. */
.code-field { display: flex; align-items: center; gap: .3rem; flex-wrap: nowrap;
  margin: .5rem 0; width: 100%; }
/* input[type=text] sets width: 100% and outranks a bare class, which is why these spanned the
   whole window. The selector has to carry the element too. */
input.code-box { flex: 1 1 0; min-width: 0; max-width: 2.4rem; width: auto;
  height: 2.6rem; padding: 0; text-align: center;
  font-family: var(--mono); font-size: 1.05rem; font-weight: 650; text-transform: uppercase;
  border: 1px solid var(--line-2); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--ink); }
input.code-box:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.code-dash { flex: 0 0 auto; color: var(--ink-3); padding: 0 .1rem; user-select: none; }
/* The code as somebody reads it back, beside a way to take a copy of it. */
.code-shown { display: inline-flex; align-items: center; gap: .55rem; flex-wrap: wrap;
  padding: .45rem .7rem; border: 1px solid var(--line-2); border-radius: var(--radius-sm);
  background: var(--surface-2); font-family: var(--mono); font-size: 1rem;
  letter-spacing: .06em; }
.share-code-row { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap;
  margin: .4rem 0 .9rem; }

/* A code is never plain text: it is the only way back to an assessment, so it is always a
   thing you can take a copy of. */
.code-chip { display: inline-flex; align-items: center; gap: .5rem; }
.code-chip-btn { display: inline-flex; align-items: center; gap: .5rem;
  padding: .35rem .6rem; border: 1px solid var(--line-2); border-radius: var(--radius-sm);
  background: var(--surface-2); color: var(--ink); cursor: pointer; }
.code-chip-btn:hover { border-color: var(--accent-line); color: var(--accent); }
/* In a window, the code IS the window. Somebody is being told it is the only way back to
   their work, and the control that takes a copy of it was the quietest thing on screen. */
.cf-extra .code-chip-btn { background: var(--accent); border-color: var(--accent);
  color: #fff; padding: .6rem .9rem; font-weight: 600; }
.cf-extra .code-chip-value { font-size: 1.15rem; }
.cf-extra .code-chip-ico, .cf-extra .code-chip-btn:hover .code-chip-ico { color: #fff; }
.cf-extra .code-chip-btn:hover { background: var(--accent); filter: brightness(1.12);
  color: #fff; }
.code-chip-value { font-family: var(--mono); font-size: .95rem; letter-spacing: .06em; }
.code-chip-ico { display: inline-flex; color: var(--ink-3); }
.code-chip-btn:hover .code-chip-ico { color: var(--accent); }
.code-chip-said { font-size: .76rem; color: var(--good); }
@media (max-width: 480px) {
  input.code-box { height: 2.3rem; font-size: .9rem; }
  .code-field { gap: .2rem; }
}
.pool-art { flex: none; width: 148px; color: var(--accent); }
.sad-cat { display: block; width: 100%; height: auto; }
.pool-out h2 { margin: 0 0 .3rem; }
.pool-out p { margin: 0 0 .5rem; max-width: 48ch; }
.pool-alt-h { font-size: .95rem; margin: 1.2rem 0 .2rem; padding-top: .9rem;
  border-top: 1px solid var(--line); }
@media (max-width: 620px) { .pool-art { width: 108px; } }

.set-list-main { min-width: 0; }
.set-list-act { display: flex; gap: .35rem; align-items: center; flex: none; }

/* The three-dot menu. Preview, make active, delete, and who added it. */
.set-menu { position: relative; }
.set-menu-btn { list-style: none; cursor: pointer; display: grid; place-items: center;
  width: 1.8rem; height: 1.8rem; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface-2); color: var(--ink-2); font-size: 1rem; line-height: 1; }
.set-menu-btn::-webkit-details-marker { display: none; }
.set-menu-btn:hover { border-color: var(--accent-line); color: var(--accent); }
.set-menu-pop { position: absolute; right: 0; top: 2.1rem; z-index: 5; min-width: 15rem;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px;
  box-shadow: var(--shadow-lg); padding: .25rem; display: flex; flex-direction: column; }
.menu-item { text-align: left; background: none; border: 0; border-radius: 7px;
  padding: .4rem .55rem; font-size: .85rem; color: var(--ink); cursor: pointer; }
.menu-item:hover { background: var(--surface-2); border: 0; }
.menu-item.is-off { color: var(--ink-3); cursor: default; }
.menu-item.is-off:hover { background: none; }
/*
 * TAKEN OUT ON 20 OCTOBER 2026 with the pair it styled, and kept for the same reason.
 *
 * A submission's menu held Copy the access code, then Open it and Stop counting it under a
 * rule at a smaller size and a dimmer ink. Both of those are gone from views-review.ts, so
 * nothing wears this. Restoring the commented block there restores the need for it.
 *
 * .menu-item.menu-second { font-size: .78rem; color: var(--ink-2); padding-top: .3rem;
 *   padding-bottom: .3rem; }
 */
.menu-danger { color: var(--bad); font-weight: 600; }
.menu-danger:hover { background: var(--bad-bg); }

/* A control that does not work yet. Yellow, and always beside something disabled. */
.badge-mockup { background: var(--warn-bg); color: var(--warn);
  border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
button.is-mockup, a.is-mockup { opacity: .62; cursor: not-allowed; }
.mockup-row { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; }

/* Sharing. One list, grouped by what somebody was added as. */
.share-dialog { max-width: 34rem; }
.share-group { margin: .9rem 0 .35rem; font-size: .82rem; letter-spacing: .01em; }
.share-row { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
  padding: .35rem 0; border-top: 1px solid var(--line); }
.share-add { display: block; margin: .7rem 0 .5rem; }
.share-add input { width: 100%; }
.share-roles { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: .6rem; }
.chip { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2);
  border-radius: var(--radius-chip); padding: .18rem .6rem; font-size: .76rem; cursor: pointer; }
.chip.on { border-color: var(--accent-line); background: var(--surface); color: var(--accent);
  font-weight: 600; }
.menu-note { border-top: 1px solid var(--line); margin-top: .2rem; padding: .35rem .55rem .15rem; }

.set-preview { margin: .5rem 0 .2rem; padding: .5rem .6rem; background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 8px; }
.set-preview .kv { margin: 0 0 .4rem; }
.set-preview-q { margin: 0; padding-left: 1.1rem; }
.set-preview-q li { margin-bottom: .15rem; }
.kv.tight dt, .kv.tight dd { padding: .1rem 0; }
/* A button with an icon beside a label. Without this the two sat on the text baseline and the
   icon rode high, which read as a mistake rather than a control. */
.btn-icon { display: inline-flex; align-items: center; gap: .4rem; }
.btn-icon svg { flex: none; display: block; }

.danger-text { color: var(--bad); }
.danger-text[disabled] { color: var(--ink-3); }

.sitefoot .proto { color: var(--warn); font-weight: 600; }

.ref-line { margin: .1rem 0 .6rem; color: var(--ink-2); }

/* A note line. Neither a question nor an instruction: a fact somebody needs once, so it reads
   as an aside and not as another paragraph of the form. */
.note-line { display: flex; align-items: baseline; gap: .45rem; flex-wrap: wrap;
  margin: .2rem 0 .9rem; padding: .4rem .6rem; border-left: 2px solid var(--line-2);
  background: var(--surface-2); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: .78rem; }
.note-key { text-transform: uppercase; letter-spacing: .08em; font-size: .66rem;
  font-weight: 700; color: var(--ink-3); }
.note-line b.mono { letter-spacing: .08em; color: var(--ink); }
.note-say { color: var(--ink-3); flex: 1 1 16rem; min-width: 0; }
.ref-line b { letter-spacing: .08em; }
.ref-chip { display: inline-block; border: 1px solid var(--line-2); border-radius: 5px;
  padding: 0 .25rem; letter-spacing: .06em; }

.ev-subject { margin: .35rem 0 .1rem; }
.ev-subject-row { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
.ev-subject code { background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 6px; padding: .2rem .4rem; font-size: .78rem; word-break: break-word; }

.marking-banner .mark-note { font-weight: 600; letter-spacing: .04em; opacity: .8;
  text-transform: none; margin-left: .5rem; }

/* Two letters, so it takes no room in a header that is already full. */
/* One link naming the other language, which is the Canada.ca pattern. It sits at the height of
   the settings button beside it, and collapses to two letters where the header runs out of room. */
.lang-link { display: inline-flex; align-items: center; height: 33px; padding: 0 .35rem;
  font-size: .78rem; font-weight: 600; white-space: nowrap; text-decoration: none; }
.lang-link:hover { text-decoration: underline; }
.lang-link abbr { text-decoration: none; text-transform: uppercase; letter-spacing: .04em; }
.lang-abbr { display: none; }

.save-state { display: inline-flex; align-items: center; gap: .35rem; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--radius-chip); padding: .16rem .55rem; color: var(--ink-2); white-space: nowrap; }
.save-state:hover { border-color: var(--accent-line); color: var(--accent); }
.save-state.hidden { display: none; }
.save-state .ss-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--ink-3); }
.save-state.st-online { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
.save-state.st-online .ss-dot { background: var(--good); }
/* Saved once and edited since. Amber, because nothing is lost and something is owed: the copy
   an assessor reads is older than the one on screen until the button is pressed again. */
.save-state.st-behind { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.save-state.st-behind .ss-dot { background: var(--warn); }
.save-state.st-failed { color: var(--bad); font-weight: 600;
  border-color: var(--bad); background: var(--bad-bg); }
.save-state .ss-short { display: none; }
.save-state .spin { width: 9px; height: 9px; border-radius: 999px;
  border: 1.5px solid var(--line-2); border-top-color: var(--accent);
  animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .save-state .spin { animation: none; } }
@media (max-width: 720px) {
  .save-state .ss-long { display: none; }
  .save-state .ss-short { display: inline; }
  .lang-full { display: none; }
  .lang-abbr { display: inline; }
}
.footer-actions { display: flex; gap: .45rem; }
/* Both wordings live in the element and the phone query reveals the narrow one. This is how
   .save-state and .lang-link already carry two lengths, so the bar joins a pattern the chrome
   already has. */
.fb-short { display: none; }
/**
 * The bars are a third group on the action row, beside the score and the buttons.
 *
 * 20rem is what the pair needs before a caption sets to three lines, and it is a floor and not
 * a width: the bars take the slack on a wide window, and where 20rem will not fit beside the
 * other two groups the row wraps and they take the line above, which is the row they used to
 * have. The buttons are 38px tall and a caption over a 5px rail is 25px, so the line they now
 * share is no taller than the buttons made it.
 */
/**
 * Two tracks of the same width, each with a floor, and the row decides how many fit.
 *
 * The first track used to be capped at 14rem and the second took everything left, which was
 * right while the pair had a row of the full page to itself. As one group of three on the
 * action row the pair is 328px wide in French, so the fixed track took 224 of it and left the
 * longer of the two captions 87px: "Evaluation entiere 2 sur 176" set to three lines and the
 * bar stood 80px tall. Equal tracks give that caption 156px and two lines, and the phone, where
 * the pair is 338px wide, gets the 161px it was given at 480 by a rule of its own.
 */
.progress-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
  gap: .5rem 1rem; padding: 0; flex: 1 1 20rem; }
.pbar { display: grid; gap: .2rem; }
/**
 * The words are the label and the number is the value, so they are not drawn alike. Asked
 * about: this section is always the same on each section, i guess they should be styled
 * differently. Nothing in the design systems checked prescribes this for a progress caption;
 * what they do ask for is a concise label and a value that stays readable, so the value is the
 * part carrying the ink.
 */
.pbar-label { font-size: .72rem; color: var(--ink-3); font-weight: 600;
  font-variant-numeric: tabular-nums; }
.pbar-count { color: var(--ink-2); font-weight: 700; }
.progress-shell { height: 5px; border-radius: 999px; background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.progress-shell i { display: block; height: 100%; border-radius: 999px; background: var(--accent);
  transition: width .3s cubic-bezier(.4, 0, .2, 1); }
.progress-shell i.done { background: var(--good); }
.progress-shell i.celebrate { animation: section-done 1s ease-out; }
@keyframes section-done {
  0%   { box-shadow: 0 0 0 0 rgba(31, 107, 60, .0); filter: brightness(1); }
  25%  { box-shadow: 0 0 14px 3px rgba(31, 107, 60, .75); filter: brightness(1.5); }
  100% { box-shadow: 0 0 0 0 rgba(31, 107, 60, .0); filter: brightness(1); }
}
@media (prefers-reduced-motion: reduce) {
  .progress-shell i { transition: none; }
  .progress-shell i.celebrate { animation: none; }
}

/* ---------- the bar at the bottom, on a phone -------------------------------------------- */
/**
 * The bar stood 191px tall on a 375px screen, which is 24 per cent of it, and the question was
 * left 299px. Everything in it wrapped: the whole-assessment caption onto three lines in a 98px
 * column, the score sentence onto a row of its own, and the three buttons onto a second row
 * 60px tall.
 *
 * The English action row gives way at 731px of page, and 720 is already where the chrome swaps
 * its long labels for short ones, so the bar joins that line and no new breakpoint appears.
 */
@media (max-width: 720px) {
  .sticky-footer .fb-long { display: none; }
  .sticky-footer .fb-short { display: inline; }
  /**
   * The count half of this sentence repeats the whole-assessment caption 40px above it, so a
   * phone can spare the sight of it. It is clipped and not removed: the pill beside it carries
   * aria-hidden, so display: none here would leave somebody using a screen reader on a phone
   * with no score and no maturity band anywhere on the bar. Out of flow, so the height still
   * comes off.
   */
  .footer-readout {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
}

/* Phone portrait. 480 is this file's own phone width, and no tablet is this narrow. */
@media (max-width: 480px) {
  /* 14rem left the second caption 98px against the 158px it needs, so it set to three lines and
     both bars stood 62px tall to carry a 5px bar. Equal tracks give each caption 161px, which
     holds the longest French form on one line. */
  .progress-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  /* This button calls the same route as the My results step in the breadcrumb, and that
     breadcrumb is in the sticky chrome at the top of the same screen. Two ways to one place
     cost the action row its single line in French. */
  .footer-results { display: none; }
  /* One line of label leaves a 38px button. A thumb is aimed at 44. */
  .footer-actions button { padding-block: .63rem; }
}

.gate-band { background: var(--warn-bg);
  border-bottom: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.gate { max-width: 1200px; margin-inline: auto; color: var(--warn);
  padding: .4rem 1.15rem; font-size: .84rem;
  display: flex; align-items: center; justify-content: space-between; gap: .8rem; flex-wrap: wrap; }
.gate-marks { display: flex; gap: .25rem; flex-wrap: wrap; }
.mark-btn { font-size: .76rem; padding: .16rem .5rem; border-radius: var(--radius-chip);
  border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); background: var(--surface);
  color: var(--ink); }
.mark-btn:hover { border-color: var(--accent); background: var(--accent-soft); }

/* ---------- scores ---------------------------------------------------------------------- */

.pill { display: inline-grid; place-items: center; min-width: 2.5rem; font-family: var(--mono);
  font-weight: 700; font-size: .85rem; padding: .12rem .45rem; border-radius: var(--radius-chip);
  border: 1px solid currentColor; }
.pill.small { min-width: 1.95rem; font-size: .78rem; }
.t0  { color: var(--s0);  } .t1  { color: var(--s1);  } .t2  { color: var(--s2);  }
.t3  { color: var(--s3);  } .t4  { color: var(--s4);  } .t5  { color: var(--s5);  }
.t6  { color: var(--s6);  } .t7  { color: var(--s7);  } .t8  { color: var(--s8);  }
.t9  { color: var(--s9);  } .t10 { color: var(--s10); }
.tnone { color: var(--ink-3); }
td.t0, td.t1, td.t2, td.t3, td.t4, td.t5, td.t6, td.t7, td.t8, td.t9, td.t10 { font-weight: 700; }

.headline { display: flex; gap: 1.15rem; align-items: flex-start; flex-wrap: wrap; }
.bigscore { flex: 0 0 auto; border-radius: var(--radius); padding: .7rem 1.15rem; text-align: center;
  border: 1px solid currentColor; background: var(--surface-2); }
.bigscore .num { display: block; font-size: 2.5rem; font-weight: 750; line-height: 1;
  letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.bigscore .outof { font-size: .68rem; text-transform: uppercase; letter-spacing: .09em; font-weight: 650; }
.headline-text { flex: 1 1 20rem; min-width: 0; }

.band, .maturity { border-left: 3px solid; padding: .45rem .7rem; margin: .55rem 0;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.band.good    { border-color: var(--good); background: var(--good-bg); }
.band.neutral { border-color: var(--ink-3); background: var(--surface-2); }
.band.bad     { border-color: var(--bad);  background: var(--bad-bg); }
.maturity     { border-color: var(--accent); background: var(--accent-soft); }

/**
 * Inside the verdict, one tinted panel and no more.
 *
 * A card holding four bordered, tinted panels is the same fault as a page holding ten cards,
 * one level down: everything emphasised, so nothing is. The routing band keeps its fill,
 * because routing is the one thing on this card somebody is looking for. The maturity line and
 * the completeness line keep their coloured left rule, which is what carries the meaning, and
 * lose the fill and the padding that made them boxes.
 */
.verdict .maturity, .verdict .completeness { background: none; padding: .1rem 0 .1rem .7rem;
  border-radius: 0; margin: .5rem 0; }
.verdict .completeness.partial, .verdict .completeness.full { background: none; }

.completeness { border-left: 3px solid var(--line-2); padding: .45rem .7rem; margin: .55rem 0;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0; background: var(--surface-2); }
.completeness.partial { border-color: var(--warn); background: var(--warn-bg); }
.completeness.full { border-color: var(--good); background: var(--good-bg); }
.completeness-bar { height: 4px; border-radius: 999px; background: var(--line);
  overflow: hidden; margin-bottom: .35rem; }
.completeness-bar i { display: block; height: 100%; background: var(--warn); }
.completeness.full .completeness-bar i { background: var(--good); }

.bar-row { display: grid; grid-template-columns: minmax(9rem, 14rem) 1fr 3.2rem; gap: .7rem;
  align-items: center; margin-bottom: .45rem; }
.bar-label { font-size: .885rem; }
.bar-track { background: var(--surface-2); border-radius: 999px; height: .55rem; overflow: hidden;
  box-shadow: inset 0 0 0 1px var(--line); }
.bar-fill { height: 100%; border-radius: 999px; transition: width .25s ease; }
.b0{background:var(--s0)} .b1{background:var(--s1)} .b2{background:var(--s2)} .b3{background:var(--s3)}
.b4{background:var(--s4)} .b5{background:var(--s5)} .b6{background:var(--s6)} .b7{background:var(--s7)}
.b8{background:var(--s8)} .b9{background:var(--s9)} .b10{background:var(--s10)}
.bnone{background:var(--line-2)}
.bar-num { text-align: right; font-family: var(--mono); font-weight: 700; font-size: .87rem; }

.backlog-item { border-top: 1px solid var(--line); padding: .7rem 0; }
.backlog-item:first-of-type { border-top: 0; }
.steps { margin: .35rem 0; padding-left: 1.15rem; }

/* ---------- flags ----------------------------------------------------------------------- */

/**
 * Severity is the rail and the dot. It is never a fill.
 *
 * "look like mishmash of colour. really hard to see anything." Measured on one screen of
 * questions: four tinted grounds and five rail colours at once, and two of the tints collided
 * with the thing they sat inside. A medium finding was painted the same amber as the row
 * holding it, and a low finding the same grey as the quotation beside it, so the finding read
 * as part of its own container. One quiet ground for every severity fixes both: the panel says
 * "a finding", the rail and the dot say which kind.
 *
 * --sev is declared once and spent twice, because the previous shape set border-color only.
 * .sev-dot took currentColor, which is the text ink, so the one element whose entire job is to
 * carry severity showed the same grey on all four.
 */
.flag { --sev: var(--line-2);
  border-left: 3px solid var(--sev); background: var(--surface-2);
  padding: .5rem .7rem; margin-bottom: .45rem; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.flag.sev-high   { --sev: var(--bad); }
.flag.sev-medium { --sev: var(--warn); }
.flag.sev-low    { --sev: var(--ink-3); }
.flag.sev-info   { --sev: var(--accent); }
.flag-title { display: flex; align-items: baseline; gap: .4rem; flex-wrap: wrap; }
.challenge { font-style: italic; margin-top: .25rem; padding-left: .5rem;
  border-left: 2px solid color-mix(in srgb, currentColor 35%, transparent); }
.sev-dot { width: .5rem; height: .5rem; border-radius: 999px; flex: 0 0 auto; background: var(--sev); }

/* ---------- tables ---------------------------------------------------------------------- */

.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
/**
 * A row menu has to open outside the table.
 *
 * `overflow-x: auto` makes the computed `overflow-y` `auto` as well, so this box clips in both
 * directions, and the row menu's pop-up is inside it: the last row's menu was cut 71px below
 * the box and 300px to its right. No z-index fixes that, because clipping is not paint order.
 * Above the width where the table fits, nothing needs to scroll, so nothing needs to clip. The
 * phone keeps the scroll, which is the sanctioned exception: a table, in its own container.
 */
/**
 * 1240px, and the number is measured rather than chosen.
 *
 * It was 900, which was the width the table fitted in when it had fewer columns. The
 * submissions table needs about 1150px of its own, so between 900 and roughly 1230 the wrapper
 * stopped clipping while the table was still wider than the card it sits in - and the table
 * simply drew over the card's right edge, with no scrollbar to say so and nothing to drag.
 * Reported with a screenshot: why do those things come out of the box on the right.
 *
 * Measured at 1100, where it stood 70px proud of the card, and at 1280, where it sits 19px
 * inside it. A laptop at 1280 keeps the menus; anything narrower gets the scroll it needs.
 */
@media (min-width: 1240px) { .body-review .table-wrap, .body-admin .table-wrap { overflow: visible; } }
.row-menu .set-menu-pop { z-index: 40; }
/* Set when the menu is opened and measured, above: it would otherwise fall out of the box. */
.row-menu.menu-up .set-menu-pop { top: auto; bottom: 2.1rem; }
table { border-collapse: collapse; width: 100%; font-size: .875rem; }
th, td { text-align: left; padding: .4rem .55rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3);
  font-weight: 650; background: var(--surface); position: sticky; top: 0; }
td.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.domain-row td { background: var(--surface-2); font-weight: 700; }
.section-row td { background: color-mix(in srgb, var(--surface-2) 55%, var(--surface));
  font-weight: 600; font-size: .82rem; color: var(--ink-2); }
.triage tbody tr:hover { background: var(--accent-soft); }

/* ---------- reviewer -------------------------------------------------------------------- */

.dropzone { border: 1.5px dashed var(--line-2); }
.dropzone.over { border-color: var(--accent); background: var(--accent-soft); }
.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.15rem; }
/**
 * A tint that every row carries is not a signal.
 *
 * Measured when the flagged questions were a screen of their own: every row on it was flagged,
 * so the amber ground marked 166 rows out of 166 and told the assessor nothing. There is one
 * list now and the flagged ones are a part of it, which does not bring the tint back - on a
 * real submission they are about two thirds of the questions, and a ground on two rows in
 * three is the same wallpaper with a gap in it. Worse, the amber was the one a medium finding
 * uses, so the findings sank into the rows holding them. A row separates with its rule and its
 * space, and the finding on it is what says it is flagged.
 * Changed keeps a rail, because that one is rare and it is the assessor's own work.
 */
.audit-row { border-top: 1px solid var(--line); padding: .6rem 0; }
.audit-row + .audit-row { margin-top: .85rem; }
/* A rail is a margin, not a border: text starting 3px from it reads as text in a box that is
   too small for it. */
.audit-row.changed { border-top: 0; box-shadow: inset 3px 0 0 var(--accent);
  border-radius: var(--radius-sm); padding: .7rem .9rem .7rem 1.1rem; }
/* A quotation, not a box. It held a grey fill that a low-severity finding also held. */
.said { border-left: 2px solid var(--line-2); padding: .15rem .6rem; color: var(--ink-2); }
.audit-controls { display: flex; gap: .45rem; align-items: center; flex-wrap: wrap; margin-top: .45rem; }
.audit-controls label { font-size: .83rem; color: var(--ink-2); display: flex; align-items: center; gap: .3rem; }
.audit-controls select, .audit-controls input[type=text] { width: auto; flex: 1 1 8rem; }
/* The exchange over one question: append-only, oldest first, nobody overwritten. */
.exchange { margin: .4rem 0; font-size: .855rem; }
.exchange summary { cursor: pointer; color: var(--accent); }
.exchange-list { margin: .35rem 0 .1rem; padding-left: 1.2rem; }
.exchange-list li { margin-bottom: .3rem; }
.badge.tiny { font-size: .66rem; }

.delta { font-family: var(--mono); font-size: .8rem; font-weight: 700; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); }
/* A section heading needs room above it and under it, or it reads as part of the row it
   follows. This one had .3rem below, less than the space inside the rows beneath it. */
.section-head { display: flex; align-items: center; gap: .5rem; margin: 1.9rem 0 .75rem;
  padding-bottom: .45rem; border-bottom: 1px solid var(--line); }
.section-head button { margin-left: auto; }

/**
 * One number per card, loud, with the rest on a quiet line beside it.
 *
 * The page carried seventeen counters at one weight in four identical rows, so nothing on it
 * said what to look at first. The loud one is always the number that names something to do.
 */
/* The big number and the words beside it sat on one baseline, which is typographically
   correct and reads as misaligned: a 2.3rem figure next to 1rem text puts the words at the
   foot of the figure rather than against the middle of it. Centred against each other. */
.lead { display: flex; align-items: center; gap: .9rem; margin: .1rem 0 .2rem; }
.lead-v { font-family: var(--mono); font-size: 2.3rem; font-weight: 700; line-height: 1;
  letter-spacing: -.02em; color: var(--ink); }
.lead-v.warn { color: var(--warn); }
.lead-l { font-size: 1rem; font-weight: 550; color: var(--ink); line-height: 1.25; }
.lead-sub { font-size: .8rem; color: var(--ink-3); margin-top: .2rem; }

/**
 * The same statistic as a sentence, where the number means nothing out of its comparison.
 *
 * Big-figure-then-label reads well when the unit is the subject: 7 outliers, 21 days. It reads
 * badly when the figure only means something inside a comparison, because the eye takes the
 * number first and then has to carry it into a clause. Asked for with the sentence written
 * out: on average, the departments score themselves 0.9 points higher than the assessors
 * score them.
 *
 * So the figure is emphasised where it falls rather than lifted out in front. It is a shade
 * larger than the text around it and the same mono as every other number on this screen, which
 * is enough to find at a glance without breaking the line it belongs to.
 */
.lead-say { margin: .1rem 0 .2rem; }
.say-line { font-size: 1rem; font-weight: 550; color: var(--ink); line-height: 1.5; margin: 0; }
.say-n { font-family: var(--mono); font-size: 1.3rem; font-weight: 700; letter-spacing: -.01em;
  color: var(--ink); }
.say-n.warn { color: var(--warn); }

/**
 * A list nobody asked for yet. Closed, with its count legible while it is.
 *
 * The summary is the quietest thing on its card. What somebody came to read is the statistic;
 * the outliers are there if they want to check them. Under a category bar it was reading
 * brighter than the category's own name, which inverted that.
 */
.fold { margin-top: .45rem; }
/* `details.fold`, not `.fold`, because `.res-sub > details > summary` paints a summary in the
   accent colour at weight 550 and matched these inside the category block. It was the thing
   she was pointing at: the fold heading was brighter than the name of the category above it. */
details.fold > summary { cursor: pointer; font-size: .76rem; color: var(--ink-3);
  font-weight: 400; padding: .2rem 0;
  list-style: none; display: flex; align-items: center; gap: .35rem; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: ''; width: 0; height: 0; flex: 0 0 auto;
  border-left: 4px solid var(--ink-3); border-top: 3.5px solid transparent;
  border-bottom: 3.5px solid transparent; opacity: .7;
  transition: transform .15s; transform-origin: 25% 50%; }
details.fold[open] > summary::before { transform: rotate(90deg); }
details.fold > summary:hover { color: var(--ink-2); }
/* Under a bar it is quieter still, because the bar's own label is what names the thing. */
.cut details.fold > summary { font-size: .72rem; color: var(--ink-3); font-weight: 400; }

/**
 * The three cards that lead with a number are one group and sit closer together.
 *
 * The gap on this page is 2.9rem, set by `.body-admin > * + *` and not by the card's own
 * margin — which is why the first attempt at this moved nothing worth moving and made the one
 * gap that should have stayed the tightest on the page. Measured rather than reasoned: the
 * cards were reporting margin-top 46.4px and margin-bottom 0.
 *
 * The gap that stays is the one below the group, because it is the join between the part of
 * the page that names something to do and the part that is background. It is marked on the
 * card below rather than taken from source order, so the group can be reordered.
 */
.body-admin > .card.lead-card + .card.lead-card { margin-top: 1.1rem; }
.body-admin > .card.after-leads { margin-top: 2.9rem; }

/* A thing that fell outside the spread, and a way into it. It is a row you press, so it is a
   button; it is in a list of its own, so it does not need to look like one. */
.outliers { display: flex; flex-direction: column; gap: .15rem; margin-top: .6rem; }
.outliers-tight { margin: .2rem 0 .5rem 0; }
.outlier { display: flex; align-items: baseline; gap: .6rem; width: 100%; text-align: left;
  background: none; border: 0; border-left: 2px solid var(--line-2); border-radius: 0;
  padding: .25rem .5rem; cursor: pointer; font-size: .85rem; color: var(--ink-2); }
.outlier:hover, .outlier:focus-visible { background: var(--accent-soft); color: var(--ink);
  border-left-color: var(--accent); }
.outlier-n { font-family: var(--mono); font-weight: 700; color: var(--ink); min-width: 2.2rem; }
.outlier-n.red { color: var(--bad); }
.outlier-name { font-weight: 550; color: var(--ink); }
.outlier-dept { color: var(--ink-3); font-size: .78rem; margin-left: auto; }

.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: .5rem;
  margin-bottom: .2rem; }
.kpi { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: .5rem .65rem; }
.kpi-num { display: block; font-family: var(--mono); font-size: 1.35rem; font-weight: 700; line-height: 1.1; }
.kpi-label { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3);
  font-weight: 650; }

/* ---------- finishing a section ---------------------------------------------------------- */

.confetti { position: fixed; inset: auto 0 0 0; height: 0; pointer-events: none; z-index: 60; }
.confetti i {
  position: absolute; bottom: 3.2rem; left: var(--x); width: 7px; height: 11px;
  background: var(--c); border-radius: 1px; opacity: 0;
  animation: confetti-rise 1.5s cubic-bezier(.2, .7, .3, 1) var(--d) forwards;
}
@keyframes confetti-rise {
  0%   { opacity: 0; transform: translate3d(0, 0, 0) rotate(0deg); }
  12%  { opacity: 1; }
  100% { opacity: 0; transform: translate3d(var(--r), -60vh, 0) rotate(540deg); }
}
@media (prefers-reduced-motion: reduce) {
  .confetti { display: none; }
}

/* ---------- print ----------------------------------------------------------------------- */

@media print {
  .topbar, .sticky-footer, .actions, .sitefoot, .stepper, button, .filelabel, .snap-hint { display: none !important; }
  /* An open dialog lives in the top layer and would otherwise print as the entire page. */
  dialog { display: none !important; }
  .set-nav, .undo-bar { display: none !important; }
  .set-layout { display: block; }
  .body-results > section { min-height: auto; display: block; }
  input, select, textarea, .score-row, .chosen, .evidence .ev-item, .ev-head, .note-secure { display: none !important; }
  .print-only { display: block; }
  ul.print-only { display: block; padding-left: 1.1rem; }
  /* Paper has no header to carry the tag, so the band comes back for the printed copy. */
  .marking-banner.screen-off { display: block; }
  .print-answer { font-weight: 700; margin: .2rem 0; }
  .print-said { margin: .1rem 0 .2rem; }
  .print-evidence { margin: .1rem 0 .3rem; font-size: 10pt; }
  .field > span { font-weight: 600; }
  .field:has(textarea) > span, .field:has(input) > span, .field:has(select) > span { display: none; }
  body { background: #fff; color: #000; font-size: 11pt; }

  /* A section holding 14 questions can never honour break-inside: avoid, so the rule moves
     down onto the question, which is a size a page can actually keep together. */
  .card { border: 0; box-shadow: none; padding: 0 0 .7rem; margin: 0 0 .7rem; break-inside: auto; }
  /* Card borders do not exist on paper, which is why the separation on screen is built out of
     typography and rules: those survive here. */
  .res-region { border-top: 1pt solid #000; padding-top: .3rem; margin-top: 1.4rem;
    break-inside: auto; }
  .res-region > h2, .res-sub > h3 { break-after: avoid; }
  .res-sub { margin-top: .8rem; }
  .card.verdict { border: 0; border-bottom: 1.5pt solid #000; box-shadow: none;
    padding: 0 0 .5rem; margin: 0 0 .8rem; }
  .verdict-edge, .completeness-bar { display: none; }
  .card.warn.alert { border: 1pt solid #000; padding: .3rem .4rem; }
  .res-sub .table-wrap { border: 0; }
  .res-region .flag { border: 0; border-left: 2pt solid #000; background: none; }
  .question { break-inside: avoid; }
  .marking-banner { position: static; background: none !important; color: #000 !important;
    border-bottom: 2px solid #000; }
  /* Sections are forced open by openEverythingForPrint() before the dialog, because CSS
     cannot reveal a closed <details>. The summary stays visible: it carries the title. */
  .section-summary::before { display: none; }
  .section-summary { break-after: avoid; }
  .body { max-width: none; margin: 0; padding: 0; }
  a { color: #000; }
}

@media (max-width: 620px) {
  /* The score is the dominant element, and it stays dominant on a phone at a smaller size. */
  .card.verdict .bigscore .num { font-size: 2.4rem; }
  .card.verdict { padding: 1rem 1.05rem; }
  .res-region > h2 { font-size: 1.16rem; }
  .ev-row { grid-template-columns: 1fr 1fr; }
  .bar-row { grid-template-columns: 1fr 3.2rem; }
  .bar-track { grid-column: 1 / -1; }
  .headline { gap: .8rem; }
  .bigscore .num { font-size: 2rem; }
}

/* ------------------------------------------------------------------------------------------
   The classified pledge. A panel below the fold is not a warning: this one takes the screen,
   and its close control is dead until the box is ticked.
   ------------------------------------------------------------------------------------------ */
.pledge-scrim { position: fixed; inset: 0; background: rgba(8, 10, 14, .55); z-index: 60; }
dialog.pledge {
  border: 1px solid var(--line-2); border-radius: 14px; padding: 0; z-index: 61;
  max-width: 34rem; width: calc(100% - 2rem); background: var(--surface); color: var(--ink);
  box-shadow: 0 24px 60px rgba(8, 10, 14, .35);
  border-top: 4px solid var(--bad);
}
dialog.pledge::backdrop { background: rgba(8, 10, 14, .55); }
dialog.pledge.no-modal {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); margin: 0;
}
.pledge-head {
  display: flex; align-items: flex-start; gap: .6rem; padding: .9rem 1rem .5rem;
  border-bottom: 1px solid var(--line);
}
.pledge-head h2 { font-size: 1.05rem; margin: 0; flex: 1; color: var(--bad); }
.pledge-x {
  flex: none; display: grid; place-items: center; width: 1.9rem; height: 1.9rem; padding: 0;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2);
  color: var(--ink-3); cursor: not-allowed;
}
.pledge-x[disabled] { opacity: .5; }
.pledge-x.live { color: var(--ink); border-color: var(--line-2); cursor: pointer; }
.pledge-x.live:hover { background: var(--surface); border-color: var(--accent-line); color: var(--accent); }
.pledge-body { padding: .8rem 1rem 1rem; font-size: .9rem; }
.pledge-body p { margin: 0 0 .6rem; }
.pledge-body .steps { margin: 0 0 .7rem; }
.pledge-subject {
  display: block; margin: .35rem 0; padding: .35rem .5rem; background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 6px; font-size: .8rem; word-break: break-all;
}
.pledge-ack {
  display: flex; gap: .5rem; align-items: flex-start; margin: .8rem 0 .3rem;
  padding: .6rem .7rem; background: var(--warn-bg); border: 1px solid var(--warn);
  border-radius: 8px; font-weight: 600;
}
.pledge-hint { font-size: .78rem; color: var(--ink-3); margin: 0 0 .5rem; }
.pledge-out { border-top: 1px solid var(--line); padding-top: .6rem; }

/* ---------- who is saving ----------------------------------------------------------------
   Two fields inside the save-online window. The remembered values are shown as placeholder
   text rather than filled in, because a filled field is a claim the tool is making on
   somebody's behalf, and the second person to use a shared machine would save under the first
   person's name without reading it. */
.signer { display: grid; gap: .5rem; margin: .2rem 0 .1rem; }
.signer-row { display: grid; grid-template-columns: 8.5rem 1fr; align-items: center; gap: .6rem; }
.signer-label { font-size: .8rem; color: var(--ink-2); font-weight: 600; }
input.signer-box { width: 100%; padding: .42rem .55rem; font: inherit; font-size: .9rem;
  border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface);
  color: var(--ink); }
input.signer-box:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px;
  border-color: var(--accent-line); }
input.signer-box::placeholder { color: var(--ink-3); opacity: 1; }
.signer-advice:empty { display: none; }
.signer-advice { font-size: .78rem; color: var(--warn); margin: 0; }
/* A changed address is worth a look, not an alarm: it is usually somebody's second address. */
.signer-changed { color: var(--ink-2); }
.signer-hint { font-size: .76rem; color: var(--ink-3); margin: 0; }
@media (max-width: 520px) {
  .signer-row { grid-template-columns: 1fr; gap: .2rem; }
}

/* ---------- a window that says no --------------------------------------------------------
   A refusal that only adds a line of text is a refusal people miss: they press the button,
   nothing visibly happens, and they press it again harder. The movement is small and short,
   and it is off entirely for anybody who has asked for less motion. */
@keyframes cf-shake {
  0%, 100% { transform: translateX(0); }
  15% { transform: translateX(-7px); }
  30% { transform: translateX(6px); }
  45% { transform: translateX(-4px); }
  60% { transform: translateX(3px); }
  80% { transform: translateX(-1px); }
}
dialog.confirm.shake { animation: cf-shake .34s cubic-bezier(.36, .07, .19, .97) both; }
@media (prefers-reduced-motion: reduce) {
  dialog.confirm.shake { animation: none; }
}

/* The box somebody has to tick before an assessment can be replaced. It sits apart from the
   buttons, because it is a statement and not a choice between actions. */
.cf-agree { display: flex; gap: .55rem; align-items: flex-start; margin: .7rem 0 .1rem;
  padding: .55rem .7rem; border: 1px solid var(--line-2); border-radius: 8px;
  background: var(--surface-2); font-size: .86rem; cursor: pointer; }
.cf-agree-box { margin-top: .15rem; flex: 0 0 auto; width: 1rem; height: 1rem; accent-color: var(--accent); }
.cf-agree:hover { border-color: var(--accent-line); }

/* ---------- the save trail ----------------------------------------------------------------
   Folded, because it is the second question an assessor asks and never the first. */
.trail { margin-top: .9rem; }
.trail > summary { cursor: pointer; font-size: .82rem; color: var(--ink-2); padding: .25rem 0; }
.trail > summary:hover { color: var(--accent); }
.trail-table { margin-top: .5rem; font-size: .82rem; }
.trail-table .tiny { font-size: .72rem; }

/* ---------- destination cards, in settings -----------------------------------------------
   Asked for by name: the course-hub card. A setting is a sentence with a control beside it; a
   destination is a place, and a person looking for one should find it without reading. So the
   coloured rail down the left, the mono eyebrow, the large title, and the arrow that moves. */

.hub-cards { display: flex; flex-direction: column; gap: 1rem; }
.hub-card {
  position: relative; display: block; overflow: hidden;
  padding: 1.6rem 1.7rem 1.35rem;
  text-decoration: none; color: inherit;
  background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px;
  transition: transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s, border-color .18s;
}
.hub-card::before {
  content: ""; position: absolute; inset: 0 auto 0 0; width: 4px;
  background: var(--card-accent, var(--accent)); opacity: .9; transition: width .18s;
}
.hub-card:hover { transform: translateY(-3px); border-color: var(--card-accent, var(--accent)); }
.hub-card:hover::before { width: 6px; }
.hub-card:active { transform: translateY(-1px); }
.hub-card:focus-visible { outline: 2px solid var(--card-accent, var(--accent)); outline-offset: 3px; }
.hub-ghost {
  position: absolute; right: 1.1rem; top: -1.1rem;
  font-size: 5.5rem; line-height: 1; font-weight: 700;
  color: var(--ink); opacity: .045; pointer-events: none; user-select: none;
}
.hub-eyebrow {
  display: block; font-family: var(--mono); font-size: .66rem;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--card-accent, var(--accent)); margin-bottom: .4rem;
}
.hub-card h3 { margin: 0 0 .45rem; font-size: 1.5rem; font-weight: 650; letter-spacing: -.015em; }
.hub-card p { margin: 0; font-size: .92rem; color: var(--ink-2); max-width: 54ch; }
.hub-meta {
  display: flex; flex-wrap: wrap; gap: .3rem 1.1rem;
  font-size: .8rem; color: var(--ink-3); margin-top: .55rem;
}
.hub-go {
  display: flex; align-items: center; gap: .5rem; margin-top: .9rem;
  font-family: var(--mono); font-size: .69rem; letter-spacing: .1em; text-transform: uppercase;
  color: var(--card-accent, var(--accent));
}
.hub-arrow { display: inline-flex; transition: transform .18s; }
.hub-arrow svg { width: .95rem; height: .95rem; }
.hub-card:hover .hub-arrow { transform: translateX(4px); }
@media (prefers-reduced-motion: reduce) {
  .hub-card, .hub-arrow { transition: none; }
  .hub-card:hover { transform: none; }
}
@media (max-width: 520px) { .hub-card { padding: 1.3rem 1.2rem 1.15rem; } .hub-ghost { font-size: 4rem; } }

/* ---------- a category, opened -------------------------------------------------------------
   The bar is the summary and the questions behind it are the detail. A number with nothing
   behind it is a number somebody has to take on trust, and the first thing anybody does with a
   low category score is ask which questions made it low. */
.cat-open { border-bottom: 1px solid var(--line); }
.cat-open:last-of-type { border-bottom: none; }
/* A fourth track for the chevron. It was floated instead, which in a three-column grid makes
   it a fourth grid item: it sat on an implicit row under the bar and jumped when the row
   reflowed on open. A float has no business inside a grid. */
.cat-open > summary.bar-row {
  /* Said outright. A <summary> is display:list-item by default, and relying on .bar-row to
     turn it into a grid leaves the outcome to rule order. */
  display: grid;
  cursor: pointer; list-style: none; border-radius: 6px;
  grid-template-columns: minmax(9rem, 14rem) 1fr 3.2rem 1.1rem;
  align-items: center;
}
.cat-open > summary::-webkit-details-marker { display: none; }
.cat-open > summary::after {
  content: "\203A";
  color: var(--ink-3); font-size: 1.05rem; line-height: 1;
  justify-self: end; align-self: center;
  transition: transform .18s;
}
.cat-open[open] > summary::after { transform: rotate(90deg); }
.cat-open > summary:hover .bar-label { color: var(--accent); }
.cat-open > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.cat-list { display: flex; flex-direction: column; gap: .2rem; margin: .5rem 0 1rem; }
.cat-q {
  display: grid; grid-template-columns: 2.3rem 1fr 1rem; gap: .7rem; align-items: baseline;
  width: 100%; text-align: left; padding: .5rem .6rem;
  background: none; border: none; border-radius: 7px;
  font: inherit; font-size: .88rem; color: var(--ink-2); cursor: pointer;
}
.cat-q:hover { background: var(--surface-2); color: var(--ink); }
.cat-q:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.cat-q-score {
  font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600;
  font-size: .82rem; text-align: right;
}
.cat-q-score.dim { color: var(--ink-3); font-weight: 400; font-size: .72rem; }
.cat-q-text { min-width: 0; }
.cat-q-where { display: block; font-size: .74rem; color: var(--ink-3); margin-top: .1rem; }
.cat-q-go { color: var(--ink-3); transition: transform .16s; }
.cat-q:hover .cat-q-go { transform: translateX(3px); color: var(--accent); }

/* Where the eye should land after a jump. Twenty near-identical question cards do not tell
   anybody which one they were brought to, and they clicked a specific question by name. */
.q-block.brought-here, [data-qid].brought-here {
  animation: brought-here 2.4s ease-out both;
  border-radius: 10px;
}
@keyframes brought-here {
  0%, 55% { box-shadow: 0 0 0 3px var(--accent-line), 0 0 0 8px var(--accent-soft); }
  100% { box-shadow: 0 0 0 3px transparent, 0 0 0 8px transparent; }
}
@media (prefers-reduced-motion: reduce) {
  .cat-open > summary::after, .cat-q-go { transition: none; }
  .q-block.brought-here, [data-qid].brought-here { animation: none; box-shadow: 0 0 0 3px var(--accent-line); }
}

/* ---------- where the score comes from, as one block ---------------------------------------
   Two panels inside one frame: the domains that build the number, and the same answers cut by
   category. They were two loose subsections under a heading and read as two unrelated lists. */
.cuts {
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); overflow: hidden;
}
.cuts > .cut { padding: 1.15rem 1.25rem 1.3rem; margin: 0; }
.cuts > .cut + .cut { border-top: 1px solid var(--line); }
.cuts > .cut > h3 { margin-top: 0; }
@media (max-width: 520px) { .cuts > .cut { padding: 1rem .9rem 1.1rem; } }

/* ---------- the verdict card ---------------------------------------------------------------
   It is the summary of everything and it was reading as the first paragraph of one long block
   of text. So the card carries its own ground and a little more air, and the code sits on its
   own line with a word saying what it is: inline it pressed against the department name with
   nothing between them but a space. */
.verdict { background: var(--surface-2); padding-top: 1.5rem; padding-bottom: 1.4rem; }
.verdict-where { margin-bottom: 0; }
.verdict-code {
  display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
  margin-top: .85rem; padding-top: .8rem;
  border-top: 1px solid var(--line);
}
.verdict-code-key {
  font-size: .72rem; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 650;
}
/* Room around it, so it reads as a control and not as a run of characters in a sentence. */
.verdict-code .code-chip-btn { padding: .3rem .6rem; }

/* The assessor's copy of the category list is read-only: an opinion about a question belongs in
   the audit, which is its own screen with its own reasons attached. */
.cat-q-flat { cursor: default; grid-template-columns: 2.3rem 1fr; }
.cat-q-flat:hover { background: none; color: var(--ink-2); }

/* ---------- who has access -------------------------------------------------------------- */
/* The form sits above the list it changes, so it is bounded and the list is not. Two fields
   side by side above phone width: a name and an address are one act, not two. */
.people-add { background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: .8rem .9rem; margin-bottom: 1.4rem; }
.people-add .field { margin-bottom: .6rem; }
.people-add input { width: 100%; }
.people-add .signer-advice { margin-bottom: .5rem; }
@media (min-width: 620px) {
  .people-add { display: grid; grid-template-columns: 1fr 1fr; gap: 0 .9rem; align-items: end; }
  .people-add .signer-advice, .people-add button { grid-column: 1 / -1; }
  .people-add button { justify-self: start; }
}
/* A row whose access is gone is history rather than a worklist, so it sits back. */
.set-row .badge-warn + *, .people-gone { opacity: .85; }

/* ---------- danger zone ------------------------------------------------------------------ */
/* Drawn the way GitHub draws its own: a red-bordered box, red separators between rows, and an
   outline button on each row. The filled destructive colour is kept for the button inside the
   window that actually commits, so nothing out here looks like the last step. */
.danger-box { border: 1px solid var(--bad); border-radius: var(--radius); overflow: hidden; }
.danger-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .5rem 1.2rem;
  align-items: start; padding: .9rem 1rem; }
.danger-row + .danger-row { border-top: 1px solid var(--bad); }
.danger-row-title { font-weight: 650; font-size: .95rem; }
.danger-row p { font-size: .855rem; color: var(--ink-2); margin: .2rem 0 0; max-width: 62ch; }
.danger-row-act { justify-self: end; align-self: center; }
/* The two fields the removal window asks for, which it never offers a list for. */
.danger-find .field { margin-bottom: .6rem; }
.danger-find input { width: 100%; }
/* A note that has to be read before somebody types into the field under it. */
.note-yellow { font-size: .8rem; line-height: 1.35; margin: .1rem 0 .6rem;
  background: var(--warn-bg); border-left: 3px solid var(--warn);
  padding: .45rem .6rem; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; color: var(--ink-2); }

/* A record nobody is counting. Still readable, and plainly not part of the worklist above it. */
.withdrawn-row td { opacity: .62; }
.withdrawn-row td:first-child { font-style: italic; }

/* A note with a heading is read before the field under it; a note without one is skipped. */
.note-yellow-head { display: block; font-size: .84rem; margin-bottom: .15rem; color: var(--ink); }
/* Three fields now: first name, last name, address. Two columns above phone width. */
@media (min-width: 620px) { .people-add { grid-template-columns: 1fr 1fr; } }

/* ---------- the category lens ------------------------------------------------------------ */
/* A domain is where you are; a category is what you are looking at. Drawing them alike is what
   confuses, so the tabs stay tabs and these are chips: rounded, smaller, and on their own line.
   A right-hand rail was the first idea and cost about a fifth of the reading column at every
   width, which the question text needs more than this does. */
/**
 * The tabs and the strip are one sticky block, so neither can be scrolled through.
 *
 * The strip was put inside a bare wrapper, and the background, the bottom border and the
 * 1.15rem of side padding all lived on .chrome .stepper. So the strip was transparent, page
 * text scrolled up through it, and its label sat flush against the window edge while the tabs
 * beside it were inset. Reported in those words: they overlap with text as you scroll.
 *
 * The block carries the ground now and the two rows inside it carry none.
 */
/**
 * And the categories sit at the far end of the tabs, on the tabs' own line.
 *
 * Asked for: maybe it can be on the same line with overview business data application
 * technology, but on the right of it. Two bands were 105px of a 192px header, on a page where
 * the header and the footer took 283px of 800 and two questions fitted between them.
 *
 * Measured at 1440: the five tabs are 465px and the six chips 623px, so one line holds both
 * with room over, and the French chips are 45px wider than the English ones and still fit.
 * Which line each lands on is settled before either can shrink, so a window too narrow for
 * both puts the strip back under the tabs whole, which is where it was. space-between is what
 * holds it at the far end of a shared line and at the near end of a line of its own, and no
 * width is written down for either case.
 *
 * The hairline that used to run under the tabs has gone with the second row. A rule across
 * half a row separates nothing, and the gap between the two groups is 2.3rem of the side
 * padding they each already carry.
 */
.stepper-stack { display: flex; flex-wrap: wrap; justify-content: space-between;
  align-items: center; min-width: 0;
  background: var(--chrome-bg); border-bottom: 1px solid var(--chrome-line); }
/**
 * Neither may be sized by its own contents, because both are scrollers at phone width: a flex
 * item that cannot shrink is as wide as everything inside it, which would leave Technology and
 * the last categories past the right edge of a 375px screen with no scroller engaged to reach
 * them.
 */
.chrome .stepper-stack > .stepper,
.chrome .stepper-stack > .lens-strip { flex: 0 1 auto; min-width: 0; }
.chrome .stepper-stack > .stepper { background: none; border-bottom: 0;
  padding-bottom: .35rem; }
/* Aligned with the tabs above it, which means the same side padding they have. */
/**
 * Quiet text, with one box on it.
 *
 * Reported as crowded, and too close to the domains. Every chip had a border and a fill, so six
 * boxes sat directly under four boxes and the eye had ten things to sort out before reading a
 * word. There is one box in this row now, and it is the one that is on. Everything else is text
 * at the weight of a caption, which is what a filter that is doing nothing should look like.
 */
.lens-strip { display: flex; align-items: baseline; gap: .1rem; flex-wrap: wrap;
  font-size: .78rem; padding: .45rem 1.15rem .5rem; }
.lens-chip { font: inherit; padding: .12rem .5rem; border-radius: var(--radius-chip); cursor: pointer;
  border: 1px solid transparent; background: none; color: var(--ink-3);
  display: inline-flex; align-items: baseline; gap: .3rem; white-space: nowrap; }
.lens-chip:hover { color: var(--ink); background: var(--surface-2); }
/**
 * The chip that is on is a tint, and the only solid accent on the page is the button that
 * takes you out of it.
 *
 * Reported as: whatever I have picked, that highlight is as bright as see my results. It was
 * the same declaration, var(--accent) filled with var(--accent-ink) on top, so the filter and
 * the primary action of the whole screen were drawn with one paint. Three things on this page
 * are accented and they rank: the button is filled, the domain tab that is open is ringed, and
 * the filter is tinted. That row is below both of them, which is what was asked for.
 */
.lens-chip.on { background: var(--accent-soft); border-color: var(--accent-line);
  color: var(--ink); font-weight: 600; }
.lens-n { font-family: var(--mono); font-size: .7rem; opacity: .6; }
.lens-chip.on .lens-n { opacity: .8; }
.lens-empty { font-size: .875rem; color: var(--ink-2); margin: .4rem 0 1rem; }

/* ---------- the chrome at phone width ---------------------------------------------------- */
/**
 * 620px is the phone, and the number was already here.
 *
 * Seven narrow widths were in this file, 860, 760, 720, 700, 620, 520 and 480, and none of them
 * was the agreed one, which is how a fix made at 480 leaves the defect showing at 520. This
 * reuses 620 because the file already names it as the phone: the min-width 620 query on
 * .people-add is commented "Two columns above phone width". No new breakpoint is introduced.
 *
 * Measured at 375x812 on the Business domain. The fixed chrome was 322px of an 812px screen and
 * the footer 191px, so the question itself had 299px. 132px of that chrome was this stack: 64px
 * of domain tabs over a 67px category strip.
 */
@media (max-width: 620px) {
  /**
   * The strip stops wrapping and takes the gesture the tab row above it already teaches.
   *
   * Six chips measure 587px against 338px of room at 375px, so the row broke after Privacy and
   * spent a second line of 27px on the last three. The tabs above answer the same shortage by
   * scrolling sideways, so a reader who has met that gesture once has met it for both rows.
   *
   * scrollbar-width repeats what .chrome .stepper carries, because a classic horizontal
   * scrollbar is about 15px tall and would take back more than half of the line it saves.
   */
  .lens-strip { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
    /* .45rem and .5rem come down to .35rem and stop there. The focus ring on a chip is a 2px
       outline at a 2px offset, and a scroller clips at its padding box. */
    padding-top: .35rem; padding-bottom: .35rem; }
  .lens-strip::-webkit-scrollbar { display: none; }

  /* The same 4px floor, for the ring on a domain tab. Both halves on the bare row as well,
     because lensStrip returns null for a rubric carrying no categories and the shell is then
     handed the tab row with no .stepper-stack around it, so the rule below never matches. */
  .chrome .stepper { padding-top: .28rem; padding-bottom: .28rem; }
  .chrome .stepper-stack > .stepper { padding-bottom: .28rem; }

  /**
   * A one-word tab label and a six-character count each pay the body's 1.55 line-height, which
   * is written for paragraphs. That is 7.0px of leading on the label and 6.0px on the count.
   * About 8px of it was doing real work as the space between the two lines, so the gap takes
   * that work over at .22rem and 5.6px comes back. The tab is 46.2px afterwards, which keeps it
   * inside a fingertip.
   *
   * Putting the label and the count on one row was measured and rejected. It cuts a whole line
   * and takes the tab to 29.9px, and the tab row grows from 465px to 699px of scrolling width
   * against a 375px window, so half the domains would be off screen at rest. These tabs were
   * compared to the sheet tabs in Excel and are meant to be seen.
   */
  .chrome .step { gap: .22rem; }
  .chrome .step-label, .chrome .step-count { line-height: 1.15; }
}

/* What a question is about, beside the toggle and clipped to the right. Grey enough to blend
   into the card, because it is a fact about the question and never an instruction. */
.ladder-row { display: flex; align-items: baseline; gap: .6rem; min-width: 0; }
.ladder-row > .ladder-box { flex: 0 1 auto; min-width: 0; }
.q-cats { margin-left: auto; display: flex; gap: .25rem; overflow: hidden;
  white-space: nowrap; flex: 0 1 auto; justify-content: flex-end; }
.q-cat { font-size: .68rem; color: var(--ink-3); border: 1px solid var(--line);
  border-radius: var(--radius-chip); padding: 0 .38rem; background: var(--surface-2); }
.lens-head { margin: 0 0 1rem; }
.lens-head h2 { font-size: 1.15rem; margin: 0 0 .15rem; }
/* Which section a question came from, once the lens has stopped the sections dividing the page. */
.lens-from { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em;
  color: var(--ink-3); margin: 1.1rem 0 .3rem; }
.lens-from:first-of-type { margin-top: .2rem; }

/* A demonstration build says so above everything, in the one colour nothing else on the page
   uses, because a room shown a department name and a score will quote both afterwards. */
.demo-banner { background: #5b2d8e; color: #fff; font-size: .82rem; line-height: 1.35;
  padding: .4rem 1.15rem; border-bottom: 1px solid #3f1f66; }
.demo-banner strong { margin-right: .4rem; text-transform: uppercase; letter-spacing: .06em;
  font-size: .74rem; }
/* The sentence and the way out share the strip, and the way out keeps its own end of it so it
   is in the same place on every screen. On a narrow window they stack and it goes underneath. */
.demo-banner { display: flex; align-items: center; justify-content: space-between;
  gap: .75rem; flex-wrap: wrap; }
.demo-said { flex: 1 1 22rem; min-width: 0; }
.demo-out { color: #fff; white-space: nowrap; text-decoration: underline;
  text-underline-offset: 2px; flex: 0 0 auto; }
.demo-out:hover, .demo-out:focus-visible { text-decoration-thickness: 2px; }

/* Another assessor's reading of the same question. Quieter than the controls below it, because
   it is somebody else's work and not a thing to act on, and separated by a rail so two opinions
   never read as one. */
.other-audit { margin: .5rem 0; padding: .45rem .7rem; border-left: 3px solid var(--line-2);
  background: var(--surface-2); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.other-head { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
.audit-where { color: var(--ink-2); margin-top: .4rem; }

/* The source line on its own, once there is a list under it. The drop target is still the whole
   card, so dragging a file onto it works with nothing on screen saying it must. */
.dropzone-tight { padding: .5rem .8rem; }
.dropzone-tight .pool-in { margin: 0; }
/* The file control on the toolbar hides its own input: a bare file input prints a button and a
   filename the browser chooses the words for, in the middle of a row of our own. */
.res-toolbar .filelabel { display: inline-flex; align-items: center; gap: .4rem; cursor: pointer; }
.res-toolbar .filelabel input[type="file"] { position: absolute; width: 1px; height: 1px;
  opacity: 0; pointer-events: none; }

/* The whole row opens the submission. The cursor and the hover are the only things saying so,
   so both have to be there: a row that acts like a link and looks like a cell is a row people
   do not click. */
tr.row-open { cursor: pointer; }
tr.row-open:hover td { background: var(--surface-2); }
tr.row-open:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
/* Controls inside it keep their own cursor, because they do something else. */
tr.row-open button, tr.row-open summary, tr.row-open label { cursor: pointer; }
/* Ready, drafts and withdrawn as tabs in the toolbar, each carrying its own count so the
   shape of the pool is readable without pressing anything. */
.list-tabs { display: flex; gap: .2rem; align-items: center; margin-left: .5rem; }
/**
 * Words beside words share a baseline. A box beside words is centred.
 *
 * The count is text, in the mono face at a smaller size, and centring it against the label
 * hung it low: the two faces have different cap heights, so their optical centres do not
 * agree even when their boxes do. It reads as the number having slipped. Baseline is what
 * puts two pieces of text on the same line to a reader.
 */
.list-tabs .tab { display: inline-flex; align-items: baseline; gap: .3rem;
  padding: .3rem .55rem; border-radius: var(--radius-sm); background: none;
  border: 1px solid transparent; color: var(--ink-2); cursor: pointer; font-size: .83rem; }
.list-tabs .tab:hover { color: var(--ink); border-color: var(--line); }
.list-tabs .tab.on { background: var(--surface-2); border-color: var(--line); color: var(--ink);
  font-weight: 600; }
.list-tabs .tab-n { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); }
.list-tabs .tab.on .tab-n { color: var(--ink-2); }

/* One chip per assessor, each on its own line, at the smallest size in the table. Two names
   ran into one another as four lines of plain text that had to be read to be counted, and the
   column set the height of the row. A chip is a shape before it is a word. */
/**
 * The chip stays inside its column, which it was not doing.
 *
 * Above 900px the table's wrapper is `overflow: visible` on purpose, so a row menu can open
 * outside it, and `table` has no fixed layout - so the colgroup widths are advice and a cell
 * wide enough to need more simply takes it. An audit written by somebody with no display name
 * shows their address instead, and a real one was wide enough to push the whole table out
 * past the right edge of the card it sits in.
 *
 * The ellipsis was already asked for and could never fire: a flex child will not shrink below
 * its content without min-width 0, so the name kept its full width and the chip grew with it.
 */
.audited-who { display: flex; flex-direction: column; gap: .15rem; align-items: flex-start;
  max-width: 100%; min-width: 0; }
.audit-chip { display: inline-flex; align-items: center; gap: .25rem; max-width: 100%;
  min-width: 0;
  padding: .05rem .3rem .05rem .05rem; border: 1px solid var(--line);
  border-radius: var(--radius-sm); background: var(--surface-2); font-size: .7rem;
  line-height: 1.25; }
.audit-chip-ini { font-family: var(--mono); font-size: .62rem; font-weight: 700;
  background: var(--line); color: var(--ink-2); border-radius: 2px; padding: .05rem .18rem;
  flex: 0 0 auto; }
.audit-chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  min-width: 0; }
/* One of them is you. The cell says so, because nothing here knows which chip. */
.audited-mine .audit-chip { border-color: var(--accent-line); }
/* Nobody yet, almost down to the background. It is the answer on most rows, and a column of
   the same three words at ordinary muted weight buries the names somebody is scanning for.
   Mixed toward the surface rather than given a flat value, so it holds in both themes. */
.audited-none { color: color-mix(in srgb, var(--ink-3) 60%, var(--surface)); }
.audited-mine b { color: var(--accent); }
/* The language link on a stripped-down screen, where the header carries nothing. */
/**
 * EVERYTHING ON THE SIGN-IN SCREEN SHARES ONE LEFT EDGE.
 *
 * The card reads from the left and the two blocks under it were centred, so a column of three
 * things had three different edges and the link under the sentence sat on a line of its own.
 * Reported as: the box looks right, the text under it is centred, and together they do not.
 */
.card-lang { margin: 1rem 0 0; text-align: center; font-size: .85rem; }
/**
 * ON THE SIGN-IN SCREEN IT LINES UP WITH THE CARD, LIKE EVERYTHING ELSE THERE.
 *
 * The card reads from the left and the two lines under it were centred, so a column of three
 * things had three different edges. Reported as: the box looks right, the text under it is
 * centred, and together they do not.
 *
 * The width is set as well as the alignment, because this is a flex item in a centred column:
 * without it the box shrinks to the width of the word and the left edge it is aligned to is
 * its own, which puts the word back in the middle.
 */
