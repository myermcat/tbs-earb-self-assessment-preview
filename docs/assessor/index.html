.save-state { display: inline-flex; align-items: center; gap: .35rem; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 999px; padding: .16rem .55rem; color: var(--ink-2); white-space: nowrap; }
.save-state:hover { border-color: var(--accent-line); color: var(--accent); }
.save-state.hidden { display: none; }
.save-state .ss-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--ink-3); }
.save-state.st-online { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
.save-state.st-online .ss-dot { background: var(--good); }
/* Saved once and edited since. Amber, because nothing is lost and something is owed: the copy
   an assessor reads is older than the one on screen until the button is pressed again. */
.save-state.st-behind { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.save-state.st-behind .ss-dot { background: var(--warn); }
.save-state.st-failed { color: var(--bad); font-weight: 600;
  border-color: var(--bad); background: var(--bad-bg); }
.save-state .ss-short { display: none; }
.save-state .spin { width: 9px; height: 9px; border-radius: 999px;
  border: 1.5px solid var(--line-2); border-top-color: var(--accent);
  animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .save-state .spin { animation: none; } }
@media (max-width: 720px) {
  .save-state .ss-long { display: none; }
  .save-state .ss-short { display: inline; }
  .lang-full { display: none; }
  .lang-abbr { display: inline; }
}
.footer-actions { display: flex; gap: .45rem; }
/* Both wordings live in the element and the phone query reveals the narrow one. This is how
   .save-state and .lang-link already carry two lengths, so the bar joins a pattern the chrome
   already has. */
.fb-short { display: none; }
.progress-row { display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 1fr);
  gap: .5rem 1rem; padding: .5rem 0 0; }
.pbar { display: grid; gap: .2rem; }
.pbar-label { font-size: .72rem; color: var(--ink-3); font-weight: 600;
  font-variant-numeric: tabular-nums; }
.progress-shell { height: 5px; border-radius: 999px; background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.progress-shell i { display: block; height: 100%; border-radius: 999px; background: var(--accent);
  transition: width .3s cubic-bezier(.4, 0, .2, 1); }
.progress-shell i.done { background: var(--good); }
.progress-shell i.celebrate { animation: section-done 1s ease-out; }
@keyframes section-done {
  0%   { box-shadow: 0 0 0 0 rgba(31, 107, 60, .0); filter: brightness(1); }
  25%  { box-shadow: 0 0 14px 3px rgba(31, 107, 60, .75); filter: brightness(1.5); }
  100% { box-shadow: 0 0 0 0 rgba(31, 107, 60, .0); filter: brightness(1); }
}
@media (prefers-reduced-motion: reduce) {
  .progress-shell i { transition: none; }
  .progress-shell i.celebrate { animation: none; }
}

/* ---------- the bar at the bottom, on a phone -------------------------------------------- */
/**
 * The bar stood 191px tall on a 375px screen, which is 24 per cent of it, and the question was
 * left 299px. Everything in it wrapped: the whole-assessment caption onto three lines in a 98px
 * column, the score sentence onto a row of its own, and the three buttons onto a second row
 * 60px tall.
 *
 * The English action row gives way at 731px of page, and 720 is already where the chrome swaps
 * its long labels for short ones, so the bar joins that line and no new breakpoint appears.
 */
@media (max-width: 720px) {
  .sticky-footer .fb-long { display: none; }
  .sticky-footer .fb-short { display: inline; }
  /**
   * The count half of this sentence repeats the whole-assessment caption 40px above it, so a
   * phone can spare the sight of it. It is clipped and not removed: the pill beside it carries
   * aria-hidden, so display: none here would leave somebody using a screen reader on a phone
   * with no score and no maturity band anywhere on the bar. Out of flow, so the height still
   * comes off.
   */
  .footer-readout {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
}

/* Phone portrait. 480 is this file's own phone width, and no tablet is this narrow. */
@media (max-width: 480px) {
  /* 14rem left the second caption 98px against the 158px it needs, so it set to three lines and
     both bars stood 62px tall to carry a 5px bar. Equal tracks give each caption 161px, which
     holds the longest French form on one line. */
  .progress-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  /* This button calls the same route as the My results step in the breadcrumb, and that
     breadcrumb is in the sticky chrome at the top of the same screen. Two ways to one place
     cost the action row its single line in French. */
  .footer-results { display: none; }
  /* One line of label leaves a 38px button. A thumb is aimed at 44. */
  .footer-actions button { padding-block: .63rem; }
}

.gate-band { background: var(--warn-bg);
  border-bottom: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.gate { max-width: 1200px; margin-inline: auto; color: var(--warn);
  padding: .4rem 1.15rem; font-size: .84rem;
  display: flex; align-items: center; justify-content: space-between; gap: .8rem; flex-wrap: wrap; }
.gate-marks { display: flex; gap: .25rem; flex-wrap: wrap; }
.mark-btn { font-size: .76rem; padding: .16rem .5rem; border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); background: var(--surface);
  color: var(--ink); }
.mark-btn:hover { border-color: var(--accent); background: var(--accent-soft); }

/* ---------- scores ---------------------------------------------------------------------- */

.pill { display: inline-grid; place-items: center; min-width: 2.5rem; font-family: var(--mono);
  font-weight: 700; font-size: .85rem; padding: .12rem .45rem; border-radius: 999px;
  border: 1px solid currentColor; }
.pill.small { min-width: 1.95rem; font-size: .78rem; }
.t0  { color: var(--s0);  } .t1  { color: var(--s1);  } .t2  { color: var(--s2);  }
.t3  { color: var(--s3);  } .t4  { color: var(--s4);  } .t5  { color: var(--s5);  }
.t6  { color: var(--s6);  } .t7  { color: var(--s7);  } .t8  { color: var(--s8);  }
.t9  { color: var(--s9);  } .t10 { color: var(--s10); }
.tnone { color: var(--ink-3); }
td.t0, td.t1, td.t2, td.t3, td.t4, td.t5, td.t6, td.t7, td.t8, td.t9, td.t10 { font-weight: 700; }

.headline { display: flex; gap: 1.15rem; align-items: flex-start; flex-wrap: wrap; }
.bigscore { flex: 0 0 auto; border-radius: var(--radius); padding: .7rem 1.15rem; text-align: center;
  border: 1px solid currentColor; background: var(--surface-2); }
.bigscore .num { display: block; font-size: 2.5rem; font-weight: 750; line-height: 1;
  letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.bigscore .outof { font-size: .68rem; text-transform: uppercase; letter-spacing: .09em; font-weight: 650; }
.headline-text { flex: 1 1 20rem; min-width: 0; }

.band, .maturity { border-left: 3px solid; padding: .45rem .7rem; margin: .55rem 0;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.band.good    { border-color: var(--good); background: var(--good-bg); }
.band.neutral { border-color: var(--ink-3); background: var(--surface-2); }
.band.bad     { border-color: var(--bad);  background: var(--bad-bg); }
.maturity     { border-color: var(--accent); background: var(--accent-soft); }

/**
 * Inside the verdict, one tinted panel and no more.
 *
 * A card holding four bordered, tinted panels is the same fault as a page holding ten cards,
 * one level down: everything emphasised, so nothing is. The routing band keeps its fill,
 * because routing is the one thing on this card somebody is looking for. The maturity line and
 * the completeness line keep their coloured left rule, which is what carries the meaning, and
 * lose the fill and the padding that made them boxes.
 */
.verdict .maturity, .verdict .completeness { background: none; padding: .1rem 0 .1rem .7rem;
  border-radius: 0; margin: .5rem 0; }
.verdict .completeness.partial, .verdict .completeness.full { background: none; }

.completeness { border-left: 3px solid var(--line-2); padding: .45rem .7rem; margin: .55rem 0;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0; background: var(--surface-2); }
.completeness.partial { border-color: var(--warn); background: var(--warn-bg); }
.completeness.full { border-color: var(--good); background: var(--good-bg); }
.completeness-bar { height: 4px; border-radius: 999px; background: var(--line);
  overflow: hidden; margin-bottom: .35rem; }
.completeness-bar i { display: block; height: 100%; background: var(--warn); }
.completeness.full .completeness-bar i { background: var(--good); }

.bar-row { display: grid; grid-template-columns: minmax(9rem, 14rem) 1fr 3.2rem; gap: .7rem;
  align-items: center; margin-bottom: .45rem; }
.bar-label { font-size: .885rem; }
.bar-track { background: var(--surface-2); border-radius: 999px; height: .55rem; overflow: hidden;
  box-shadow: inset 0 0 0 1px var(--line); }
.bar-fill { height: 100%; border-radius: 999px; transition: width .25s ease; }
.b0{background:var(--s0)} .b1{background:var(--s1)} .b2{background:var(--s2)} .b3{background:var(--s3)}
.b4{background:var(--s4)} .b5{background:var(--s5)} .b6{background:var(--s6)} .b7{background:var(--s7)}
.b8{background:var(--s8)} .b9{background:var(--s9)} .b10{background:var(--s10)}
.bnone{background:var(--line-2)}
.bar-num { text-align: right; font-family: var(--mono); font-weight: 700; font-size: .87rem; }

.backlog-item { border-top: 1px solid var(--line); padding: .7rem 0; }
.backlog-item:first-of-type { border-top: 0; }
.steps { margin: .35rem 0; padding-left: 1.15rem; }

/* ---------- flags ----------------------------------------------------------------------- */

/**
 * Severity is the rail and the dot. It is never a fill.
 *
 * "look like mishmash of colour. really hard to see anything." Measured on one Audit these
 * screen: four tinted grounds and five rail colours at once, and two of the tints collided
 * with the thing they sat inside. A medium finding was painted the same amber as the row
 * holding it, and a low finding the same grey as the quotation beside it, so the finding read
 * as part of its own container. One quiet ground for every severity fixes both: the panel says
 * "a finding", the rail and the dot say which kind.
 *
 * --sev is declared once and spent twice, because the previous shape set border-color only.
 * .sev-dot took currentColor, which is the text ink, so the one element whose entire job is to
 * carry severity showed the same grey on all four.
 */
.flag { --sev: var(--line-2);
  border-left: 3px solid var(--sev); background: var(--surface-2);
  padding: .5rem .7rem; margin-bottom: .45rem; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.flag.sev-high   { --sev: var(--bad); }
.flag.sev-medium { --sev: var(--warn); }
.flag.sev-low    { --sev: var(--ink-3); }
.flag.sev-info   { --sev: var(--accent); }
.flag-title { display: flex; align-items: baseline; gap: .4rem; flex-wrap: wrap; }
.challenge { font-style: italic; margin-top: .25rem; padding-left: .5rem;
  border-left: 2px solid color-mix(in srgb, currentColor 35%, transparent); }
.sev-dot { width: .5rem; height: .5rem; border-radius: 999px; flex: 0 0 auto; background: var(--sev); }

/* ---------- tables ---------------------------------------------------------------------- */

.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
/**
 * A row menu has to open outside the table.
 *
 * `overflow-x: auto` makes the computed `overflow-y` `auto` as well, so this box clips in both
 * directions, and the row menu's pop-up is inside it: the last row's menu was cut 71px below
 * the box and 300px to its right. No z-index fixes that, because clipping is not paint order.
 * Above the width where the table fits, nothing needs to scroll, so nothing needs to clip. The
 * phone keeps the scroll, which is the sanctioned exception: a table, in its own container.
 */
@media (min-width: 900px) { .body-review .table-wrap, .body-admin .table-wrap { overflow: visible; } }
.row-menu .set-menu-pop { z-index: 40; }
table { border-collapse: collapse; width: 100%; font-size: .875rem; }
th, td { text-align: left; padding: .4rem .55rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3);
  font-weight: 650; background: var(--surface); position: sticky; top: 0; }
td.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.domain-row td { background: var(--surface-2); font-weight: 700; }
.section-row td { background: color-mix(in srgb, var(--surface-2) 55%, var(--surface));
  font-weight: 600; font-size: .82rem; color: var(--ink-2); }
.triage tbody tr:hover { background: var(--accent-soft); }

/* ---------- reviewer -------------------------------------------------------------------- */

.dropzone { border: 1.5px dashed var(--line-2); }
.dropzone.over { border-color: var(--accent); background: var(--accent-soft); }
.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.15rem; }
/**
 * A tint that every row carries is not a signal.
 *
 * Every row inside Audit these is flagged, so the amber ground marked 166 rows out of 166 and
 * told the assessor nothing. Worse, it was the same amber as a medium finding, which meant the
 * findings sank into the rows holding them. A row separates with its rule and its space now.
 * Changed keeps a rail, because that one is rare and it is the assessor's own work.
 */
.audit-row { border-top: 1px solid var(--line); padding: .6rem 0; }
.audit-row + .audit-row { margin-top: .85rem; }
.audit-row.changed { border-top: 0; box-shadow: inset 3px 0 0 var(--accent);
  border-radius: var(--radius-sm); padding: .6rem; }
/* A quotation, not a box. It held a grey fill that a low-severity finding also held. */
.said { border-left: 2px solid var(--line-2); padding: .15rem .6rem; color: var(--ink-2); }
.audit-controls { display: flex; gap: .45rem; align-items: center; flex-wrap: wrap; margin-top: .45rem; }
.audit-controls label { font-size: .83rem; color: var(--ink-2); display: flex; align-items: center; gap: .3rem; }
.audit-controls select, .audit-controls input[type=text] { width: auto; flex: 1 1 8rem; }
/* The exchange over one question: append-only, oldest first, nobody overwritten. */
.exchange { margin: .4rem 0; font-size: .855rem; }
.exchange summary { cursor: pointer; color: var(--accent); }
.exchange-list { margin: .35rem 0 .1rem; padding-left: 1.2rem; }
.exchange-list li { margin-bottom: .3rem; }
.badge.tiny { font-size: .66rem; }

.delta { font-family: var(--mono); font-size: .8rem; font-weight: 700; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); }
/* A section heading needs room above it and under it, or it reads as part of the row it
   follows. This one had .3rem below, less than the space inside the rows beneath it. */
.section-head { display: flex; align-items: center; gap: .5rem; margin: 1.9rem 0 .75rem;
  padding-bottom: .45rem; border-bottom: 1px solid var(--line); }
.section-head button { margin-left: auto; }

.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: .5rem;
  margin-bottom: .2rem; }
.kpi { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: .5rem .65rem; }
.kpi-num { display: block; font-family: var(--mono); font-size: 1.35rem; font-weight: 700; line-height: 1.1; }
.kpi-label { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3);
  font-weight: 650; }

/* ---------- finishing a section ---------------------------------------------------------- */

.confetti { position: fixed; inset: auto 0 0 0; height: 0; pointer-events: none; z-index: 60; }
.confetti i {
  position: absolute; bottom: 3.2rem; left: var(--x); width: 7px; height: 11px;
  background: var(--c); border-radius: 1px; opacity: 0;
  animation: confetti-rise 1.5s cubic-bezier(.2, .7, .3, 1) var(--d) forwards;
}
@keyframes confetti-rise {
  0%   { opacity: 0; transform: translate3d(0, 0, 0) rotate(0deg); }
  12%  { opacity: 1; }
  100% { opacity: 0; transform: translate3d(var(--r), -60vh, 0) rotate(540deg); }
}
@media (prefers-reduced-motion: reduce) {
  .confetti { display: none; }
}

/* ---------- print ----------------------------------------------------------------------- */

@media print {
  .topbar, .sticky-footer, .actions, .sitefoot, .stepper, button, .filelabel, .snap-hint { display: none !important; }
  /* An open dialog lives in the top layer and would otherwise print as the entire page. */
  dialog { display: none !important; }
  .set-nav, .undo-bar { display: none !important; }
  .set-layout { display: block; }
  .body-results > section { min-height: auto; display: block; }
  input, select, textarea, .score-row, .chosen, .evidence .ev-item, .ev-head, .note-secure { display: none !important; }
  .print-only { display: block; }
  ul.print-only { display: block; padding-left: 1.1rem; }
  .print-answer { font-weight: 700; margin: .2rem 0; }
  .print-said { margin: .1rem 0 .2rem; }
  .print-evidence { margin: .1rem 0 .3rem; font-size: 10pt; }
  .field > span { font-weight: 600; }
  .field:has(textarea) > span, .field:has(input) > span, .field:has(select) > span { display: none; }
  body { background: #fff; color: #000; font-size: 11pt; }

  /* A section holding 14 questions can never honour break-inside: avoid, so the rule moves
     down onto the question, which is a size a page can actually keep together. */
  .card { border: 0; box-shadow: none; padding: 0 0 .7rem; margin: 0 0 .7rem; break-inside: auto; }
  /* Card borders do not exist on paper, which is why the separation on screen is built out of
     typography and rules: those survive here. */
  .res-region { border-top: 1pt solid #000; padding-top: .3rem; margin-top: 1.4rem;
    break-inside: auto; }
  .res-region > h2, .res-sub > h3 { break-after: avoid; }
  .res-sub { margin-top: .8rem; }
  .card.verdict { border: 0; border-bottom: 1.5pt solid #000; box-shadow: none;
    padding: 0 0 .5rem; margin: 0 0 .8rem; }
  .verdict-edge, .completeness-bar { display: none; }
  .card.warn.alert { border: 1pt solid #000; padding: .3rem .4rem; }
  .res-sub .table-wrap { border: 0; }
  .res-region .flag { border: 0; border-left: 2pt solid #000; background: none; }
  .question { break-inside: avoid; }
  .marking-banner { position: static; background: none !important; color: #000 !important;
    border-bottom: 2px solid #000; }
  /* Sections are forced open by openEverythingForPrint() before the dialog, because CSS
     cannot reveal a closed <details>. The summary stays visible: it carries the title. */
  .section-summary::before { display: none; }
  .section-summary { break-after: avoid; }
  .body { max-width: none; margin: 0; padding: 0; }
  a { color: #000; }
}

@media (max-width: 620px) {
  /* The score is the dominant element, and it stays dominant on a phone at a smaller size. */
  .card.verdict .bigscore .num { font-size: 2.4rem; }
  .card.verdict { padding: 1rem 1.05rem; }
  .res-region > h2 { font-size: 1.16rem; }
  .ev-row { grid-template-columns: 1fr 1fr; }
  .bar-row { grid-template-columns: 1fr 3.2rem; }
  .bar-track { grid-column: 1 / -1; }
  .headline { gap: .8rem; }
  .bigscore .num { font-size: 2rem; }
}

/* ------------------------------------------------------------------------------------------
   The classified pledge. A panel below the fold is not a warning: this one takes the screen,
   and its close control is dead until the box is ticked.
   ------------------------------------------------------------------------------------------ */
.pledge-scrim { position: fixed; inset: 0; background: rgba(8, 10, 14, .55); z-index: 60; }
dialog.pledge {
  border: 1px solid var(--line-2); border-radius: 14px; padding: 0; z-index: 61;
  max-width: 34rem; width: calc(100% - 2rem); background: var(--surface); color: var(--ink);
  box-shadow: 0 24px 60px rgba(8, 10, 14, .35);
  border-top: 4px solid var(--bad);
}
dialog.pledge::backdrop { background: rgba(8, 10, 14, .55); }
dialog.pledge.no-modal {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); margin: 0;
}
.pledge-head {
  display: flex; align-items: flex-start; gap: .6rem; padding: .9rem 1rem .5rem;
  border-bottom: 1px solid var(--line);
}
.pledge-head h2 { font-size: 1.05rem; margin: 0; flex: 1; color: var(--bad); }
.pledge-x {
  flex: none; display: grid; place-items: center; width: 1.9rem; height: 1.9rem; padding: 0;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2);
  color: var(--ink-3); cursor: not-allowed;
}
.pledge-x[disabled] { opacity: .5; }
.pledge-x.live { color: var(--ink); border-color: var(--line-2); cursor: pointer; }
.pledge-x.live:hover { background: var(--surface); border-color: var(--accent-line); color: var(--accent); }
.pledge-body { padding: .8rem 1rem 1rem; font-size: .9rem; }
.pledge-body p { margin: 0 0 .6rem; }
.pledge-body .steps { margin: 0 0 .7rem; }
.pledge-subject {
  display: block; margin: .35rem 0; padding: .35rem .5rem; background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 6px; font-size: .8rem; word-break: break-all;
}
.pledge-ack {
  display: flex; gap: .5rem; align-items: flex-start; margin: .8rem 0 .3rem;
  padding: .6rem .7rem; background: var(--warn-bg); border: 1px solid var(--warn);
  border-radius: 8px; font-weight: 600;
}
.pledge-hint { font-size: .78rem; color: var(--ink-3); margin: 0 0 .5rem; }
.pledge-out { border-top: 1px solid var(--line); padding-top: .6rem; }

/* ---------- who is saving ----------------------------------------------------------------
   Two fields inside the save-online window. The remembered values are shown as placeholder
   text rather than filled in, because a filled field is a claim the tool is making on
   somebody's behalf, and the second person to use a shared machine would save under the first
   person's name without reading it. */
.signer { display: grid; gap: .5rem; margin: .2rem 0 .1rem; }
.signer-row { display: grid; grid-template-columns: 8.5rem 1fr; align-items: center; gap: .6rem; }
.signer-label { font-size: .8rem; color: var(--ink-2); font-weight: 600; }
input.signer-box { width: 100%; padding: .42rem .55rem; font: inherit; font-size: .9rem;
  border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface);
  color: var(--ink); }
input.signer-box:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px;
  border-color: var(--accent-line); }
input.signer-box::placeholder { color: var(--ink-3); opacity: 1; }
.signer-advice:empty { display: none; }
.signer-advice { font-size: .78rem; color: var(--warn); margin: 0; }
/* A changed address is worth a look, not an alarm: it is usually somebody's second address. */
.signer-changed { color: var(--ink-2); }
.signer-hint { font-size: .76rem; color: var(--ink-3); margin: 0; }
@media (max-width: 520px) {
  .signer-row { grid-template-columns: 1fr; gap: .2rem; }
}

/* ---------- a window that says no --------------------------------------------------------
   A refusal that only adds a line of text is a refusal people miss: they press the button,
   nothing visibly happens, and they press it again harder. The movement is small and short,
   and it is off entirely for anybody who has asked for less motion. */
@keyframes cf-shake {
  0%, 100% { transform: translateX(0); }
  15% { transform: translateX(-7px); }
  30% { transform: translateX(6px); }
  45% { transform: translateX(-4px); }
  60% { transform: translateX(3px); }
  80% { transform: translateX(-1px); }
}
dialog.confirm.shake { animation: cf-shake .34s cubic-bezier(.36, .07, .19, .97) both; }
@media (prefers-reduced-motion: reduce) {
  dialog.confirm.shake { animation: none; }
}

/* The box somebody has to tick before an assessment can be replaced. It sits apart from the
   buttons, because it is a statement and not a choice between actions. */
.cf-agree { display: flex; gap: .55rem; align-items: flex-start; margin: .7rem 0 .1rem;
  padding: .55rem .7rem; border: 1px solid var(--line-2); border-radius: 8px;
  background: var(--surface-2); font-size: .86rem; cursor: pointer; }
.cf-agree-box { margin-top: .15rem; flex: 0 0 auto; width: 1rem; height: 1rem; accent-color: var(--accent); }
.cf-agree:hover { border-color: var(--accent-line); }

/* ---------- the save trail ----------------------------------------------------------------
   Folded, because it is the second question an assessor asks and never the first. */
.trail { margin-top: .9rem; }
.trail > summary { cursor: pointer; font-size: .82rem; color: var(--ink-2); padding: .25rem 0; }
.trail > summary:hover { color: var(--accent); }
.trail-table { margin-top: .5rem; font-size: .82rem; }
.trail-table .tiny { font-size: .72rem; }

/* ---------- destination cards, in settings -----------------------------------------------
   Asked for by name: the course-hub card. A setting is a sentence with a control beside it; a
   destination is a place, and a person looking for one should find it without reading. So the
   coloured rail down the left, the mono eyebrow, the large title, and the arrow that moves. */
.set-sub { font-size: 1.05rem; font-weight: 650; margin: 2rem 0 .85rem; }
.hub-cards { display: flex; flex-direction: column; gap: 1rem; }
.hub-card {
  position: relative; display: block; overflow: hidden;
  padding: 1.6rem 1.7rem 1.35rem;
  text-decoration: none; color: inherit;
  background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px;
  transition: transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s, border-color .18s;
}
.hub-card::before {
  content: ""; position: absolute; inset: 0 auto 0 0; width: 4px;
  background: var(--card-accent, var(--accent)); opacity: .9; transition: width .18s;
}
.hub-card:hover { transform: translateY(-3px); border-color: var(--card-accent, var(--accent)); }
.hub-card:hover::before { width: 6px; }
.hub-card:active { transform: translateY(-1px); }
.hub-card:focus-visible { outline: 2px solid var(--card-accent, var(--accent)); outline-offset: 3px; }
.hub-ghost {
  position: absolute; right: 1.1rem; top: -1.1rem;
  font-size: 5.5rem; line-height: 1; font-weight: 700;
  color: var(--ink); opacity: .045; pointer-events: none; user-select: none;
}
.hub-eyebrow {
  display: block; font-family: var(--mono); font-size: .66rem;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--card-accent, var(--accent)); margin-bottom: .4rem;
}
.hub-card h3 { margin: 0 0 .45rem; font-size: 1.5rem; font-weight: 650; letter-spacing: -.015em; }
.hub-card p { margin: 0; font-size: .92rem; color: var(--ink-2); max-width: 54ch; }
.hub-meta {
  display: flex; flex-wrap: wrap; gap: .3rem 1.1rem;
  font-size: .8rem; color: var(--ink-3); margin-top: .55rem;
}
.hub-go {
  display: flex; align-items: center; gap: .5rem; margin-top: .9rem;
  font-family: var(--mono); font-size: .69rem; letter-spacing: .1em; text-transform: uppercase;
  color: var(--card-accent, var(--accent));
}
.hub-arrow { display: inline-flex; transition: transform .18s; }
.hub-arrow svg { width: .95rem; height: .95rem; }
.hub-card:hover .hub-arrow { transform: translateX(4px); }
@media (prefers-reduced-motion: reduce) {
  .hub-card, .hub-arrow { transition: none; }
  .hub-card:hover { transform: none; }
}
@media (max-width: 520px) { .hub-card { padding: 1.3rem 1.2rem 1.15rem; } .hub-ghost { font-size: 4rem; } }

/* ---------- a category, opened -------------------------------------------------------------
   The bar is the summary and the questions behind it are the detail. A number with nothing
   behind it is a number somebody has to take on trust, and the first thing anybody does with a
   low category score is ask which questions made it low. */
.cat-open { border-bottom: 1px solid var(--line); }
.cat-open:last-of-type { border-bottom: none; }
/* A fourth track for the chevron. It was floated instead, which in a three-column grid makes
   it a fourth grid item: it sat on an implicit row under the bar and jumped when the row
   reflowed on open. A float has no business inside a grid. */
.cat-open > summary.bar-row {
  /* Said outright. A <summary> is display:list-item by default, and relying on .bar-row to
     turn it into a grid leaves the outcome to rule order. */
  display: grid;
  cursor: pointer; list-style: none; border-radius: 6px;
  grid-template-columns: minmax(9rem, 14rem) 1fr 3.2rem 1.1rem;
  align-items: center;
}
.cat-open > summary::-webkit-details-marker { display: none; }
.cat-open > summary::after {
  content: "\203A";
  color: var(--ink-3); font-size: 1.05rem; line-height: 1;
  justify-self: end; align-self: center;
  transition: transform .18s;
}
.cat-open[open] > summary::after { transform: rotate(90deg); }
.cat-open > summary:hover .bar-label { color: var(--accent); }
.cat-open > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.cat-list { display: flex; flex-direction: column; gap: .2rem; margin: .5rem 0 1rem; }
.cat-q {
  display: grid; grid-template-columns: 2.3rem 1fr 1rem; gap: .7rem; align-items: baseline;
  width: 100%; text-align: left; padding: .5rem .6rem;
  background: none; border: none; border-radius: 7px;
  font: inherit; font-size: .88rem; color: var(--ink-2); cursor: pointer;
}
.cat-q:hover { background: var(--surface-2); color: var(--ink); }
.cat-q:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.cat-q-score {
  font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600;
  font-size: .82rem; text-align: right;
}
.cat-q-score.dim { color: var(--ink-3); font-weight: 400; font-size: .72rem; }
.cat-q-text { min-width: 0; }
.cat-q-where { display: block; font-size: .74rem; color: var(--ink-3); margin-top: .1rem; }
.cat-q-go { color: var(--ink-3); transition: transform .16s; }
.cat-q:hover .cat-q-go { transform: translateX(3px); color: var(--accent); }

/* Where the eye should land after a jump. Twenty near-identical question cards do not tell
   anybody which one they were brought to, and they clicked a specific question by name. */
.q-block.brought-here, [data-qid].brought-here {
  animation: brought-here 2.4s ease-out both;
  border-radius: 10px;
}
@keyframes brought-here {
  0%, 55% { box-shadow: 0 0 0 3px var(--accent-line), 0 0 0 8px var(--accent-soft); }
  100% { box-shadow: 0 0 0 3px transparent, 0 0 0 8px transparent; }
}
@media (prefers-reduced-motion: reduce) {
  .cat-open > summary::after, .cat-q-go { transition: none; }
  .q-block.brought-here, [data-qid].brought-here { animation: none; box-shadow: 0 0 0 3px var(--accent-line); }
}

/* ---------- where the score comes from, as one block ---------------------------------------
   Two panels inside one frame: the domains that build the number, and the same answers cut by
   category. They were two loose subsections under a heading and read as two unrelated lists. */
.cuts {
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); overflow: hidden;
}
.cuts > .cut { padding: 1.15rem 1.25rem 1.3rem; margin: 0; }
.cuts > .cut + .cut { border-top: 1px solid var(--line); }
.cuts > .cut > h3 { margin-top: 0; }
@media (max-width: 520px) { .cuts > .cut { padding: 1rem .9rem 1.1rem; } }

/* ---------- the verdict card ---------------------------------------------------------------
   It is the summary of everything and it was reading as the first paragraph of one long block
   of text. So the card carries its own ground and a little more air, and the code sits on its
   own line with a word saying what it is: inline it pressed against the department name with
   nothing between them but a space. */
.verdict { background: var(--surface-2); padding-top: 1.5rem; padding-bottom: 1.4rem; }
.verdict-where { margin-bottom: 0; }
.verdict-code {
  display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
  margin-top: .85rem; padding-top: .8rem;
  border-top: 1px solid var(--line);
}
.verdict-code-key {
  font-size: .72rem; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 650;
}
/* Room around it, so it reads as a control and not as a run of characters in a sentence. */
.verdict-code .code-chip-btn { padding: .3rem .6rem; }

/* The assessor's copy of the category list is read-only: an opinion about a question belongs in
   the audit, which is its own screen with its own reasons attached. */
.cat-q-flat { cursor: default; grid-template-columns: 2.3rem 1fr; }
.cat-q-flat:hover { background: none; color: var(--ink-2); }

/* ---------- who has access -------------------------------------------------------------- */
/* The form sits above the list it changes, so it is bounded and the list is not. Two fields
   side by side above phone width: a name and an address are one act, not two. */
.people-add { background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: .8rem .9rem; margin-bottom: 1.4rem; }
.people-add .field { margin-bottom: .6rem; }
.people-add input { width: 100%; }
.people-add .signer-advice { margin-bottom: .5rem; }
@media (min-width: 620px) {
  .people-add { display: grid; grid-template-columns: 1fr 1fr; gap: 0 .9rem; align-items: end; }
  .people-add .signer-advice, .people-add button { grid-column: 1 / -1; }
  .people-add button { justify-self: start; }
}
/* A row whose access is gone is history rather than a worklist, so it sits back. */
.set-row .badge-warn + *, .people-gone { opacity: .85; }

/* ---------- danger zone ------------------------------------------------------------------ */
/* Drawn the way GitHub draws its own: a red-bordered box, red separators between rows, and an
   outline button on each row. The filled destructive colour is kept for the button inside the
   window that actually commits, so nothing out here looks like the last step. */
.danger-box { border: 1px solid var(--bad); border-radius: var(--radius); overflow: hidden; }
.danger-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .5rem 1.2rem;
  align-items: start; padding: .9rem 1rem; }
.danger-row + .danger-row { border-top: 1px solid var(--bad); }
.danger-row-title { font-weight: 650; font-size: .95rem; }
.danger-row p { font-size: .855rem; color: var(--ink-2); margin: .2rem 0 0; max-width: 62ch; }
.danger-row-act { justify-self: end; align-self: center; }
/* The two fields the removal window asks for, which it never offers a list for. */
.danger-find .field { margin-bottom: .6rem; }
.danger-find input { width: 100%; }
/* A note that has to be read before somebody types into the field under it. */
.note-yellow { font-size: .8rem; line-height: 1.35; margin: .1rem 0 .6rem;
  background: var(--warn-bg); border-left: 3px solid var(--warn);
  padding: .45rem .6rem; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; color: var(--ink-2); }

/* A record nobody is counting. Still readable, and plainly not part of the worklist above it. */
.withdrawn-row td { opacity: .62; }
.withdrawn-row td:first-child { font-style: italic; }

/* A note with a heading is read before the field under it; a note without one is skipped. */
.note-yellow-head { display: block; font-size: .84rem; margin-bottom: .15rem; color: var(--ink); }
/* Three fields now: first name, last name, address. Two columns above phone width. */
@media (min-width: 620px) { .people-add { grid-template-columns: 1fr 1fr; } }

/* ---------- the category lens ------------------------------------------------------------ */
/* A domain is where you are; a category is what you are looking at. Drawing them alike is what
   confuses, so the tabs stay tabs and these are chips: rounded, smaller, and on their own line.
   A right-hand rail was the first idea and cost about a fifth of the reading column at every
   width, which the question text needs more than this does. */
/**
 * The tabs and the strip are one sticky block, so neither can be scrolled through.
 *
 * The strip was put inside a bare wrapper, and the background, the bottom border and the
 * 1.15rem of side padding all lived on .chrome .stepper. So the strip was transparent, page
 * text scrolled up through it, and its label sat flush against the window edge while the tabs
 * beside it were inset. Reported in those words: they overlap with text as you scroll.
 *
 * The block carries the ground now and the two rows inside it carry none.
 */
.stepper-stack { display: flex; flex-direction: column; min-width: 0;
  background: var(--chrome-bg); border-bottom: 1px solid var(--chrome-line); }
.chrome .stepper-stack > .stepper { background: none;
  border-bottom: 1px solid color-mix(in srgb, var(--chrome-line) 55%, transparent);
  padding-bottom: .35rem; }
/* Aligned with the tabs above it, which means the same side padding they have. */
/**
 * Quiet text, with one box on it.
 *
 * Reported as crowded, and too close to the domains. Every chip had a border and a fill, so six
 * boxes sat directly under four boxes and the eye had ten things to sort out before reading a
 * word. There is one box in this row now, and it is the one that is on. Everything else is text
 * at the weight of a caption, which is what a filter that is doing nothing should look like.
 */
.lens-strip { display: flex; align-items: baseline; gap: .1rem; flex-wrap: wrap;
  font-size: .78rem; padding: .45rem 1.15rem .5rem; }
.lens-chip { font: inherit; padding: .12rem .5rem; border-radius: 999px; cursor: pointer;
  border: 1px solid transparent; background: none; color: var(--ink-3);
  display: inline-flex; align-items: baseline; gap: .3rem; white-space: nowrap; }
.lens-chip:hover { color: var(--ink); background: var(--surface-2); }
.lens-chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.lens-n { font-family: var(--mono); font-size: .7rem; opacity: .6; }
.lens-chip.on .lens-n { opacity: .85; }
.lens-empty { font-size: .875rem; color: var(--ink-2); margin: .4rem 0 1rem; }

/* ---------- the chrome at phone width ---------------------------------------------------- */
/**
 * 620px is the phone, and the number was already here.
 *
 * Seven narrow widths were in this file, 860, 760, 720, 700, 620, 520 and 480, and none of them
 * was the agreed one, which is how a fix made at 480 leaves the defect showing at 520. This
 * reuses 620 because the file already names it as the phone: the min-width 620 query on
 * .people-add is commented "Two columns above phone width". No new breakpoint is introduced.
 *
 * Measured at 375x812 on the Business domain. The fixed chrome was 322px of an 812px screen and
 * the footer 191px, so the question itself had 299px. 132px of that chrome was this stack: 64px
 * of domain tabs over a 67px category strip.
 */
@media (max-width: 620px) {
  /**
   * The strip stops wrapping and takes the gesture the tab row above it already teaches.
   *
   * Six chips measure 587px against 338px of room at 375px, so the row broke after Privacy and
   * spent a second line of 27px on the last three. The tabs above answer the same shortage by
   * scrolling sideways, so a reader who has met that gesture once has met it for both rows.
   *
   * scrollbar-width repeats what .chrome .stepper carries, because a classic horizontal
   * scrollbar is about 15px tall and would take back more than half of the line it saves.
   */
  .lens-strip { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
    /* .45rem and .5rem come down to .35rem and stop there. The focus ring on a chip is a 2px
       outline at a 2px offset, and a scroller clips at its padding box. */
    padding-top: .35rem; padding-bottom: .35rem; }
  .lens-strip::-webkit-scrollbar { display: none; }

  /* The same 4px floor, for the ring on a domain tab. Both halves on the bare row as well,
     because lensStrip returns null for a rubric carrying no categories and the shell is then
     handed the tab row with no .stepper-stack around it, so the rule below never matches. */
  .chrome .stepper { padding-top: .28rem; padding-bottom: .28rem; }
  .chrome .stepper-stack > .stepper { padding-bottom: .28rem; }

  /**
   * A one-word tab label and a six-character count each pay the body's 1.55 line-height, which
   * is written for paragraphs. That is 7.0px of leading on the label and 6.0px on the count.
   * About 8px of it was doing real work as the space between the two lines, so the gap takes
   * that work over at .22rem and 5.6px comes back. The tab is 46.2px afterwards, which keeps it
   * inside a fingertip.
   *
   * Putting the label and the count on one row was measured and rejected. It cuts a whole line
   * and takes the tab to 29.9px, and the tab row grows from 465px to 699px of scrolling width
   * against a 375px window, so half the domains would be off screen at rest. These tabs were
   * compared to the sheet tabs in Excel and are meant to be seen.
   */
  .chrome .step { gap: .22rem; }
  .chrome .step-label, .chrome .step-count { line-height: 1.15; }
}

/* What a question is about, beside the toggle and clipped to the right. Grey enough to blend
   into the card, because it is a fact about the question and never an instruction. */
.ladder-row { display: flex; align-items: baseline; gap: .6rem; min-width: 0; }
.ladder-row > .ladder-box { flex: 0 1 auto; min-width: 0; }
.q-cats { margin-left: auto; display: flex; gap: .25rem; overflow: hidden;
  white-space: nowrap; flex: 0 1 auto; justify-content: flex-end; }
.q-cat { font-size: .68rem; color: var(--ink-3); border: 1px solid var(--line);
  border-radius: 999px; padding: 0 .38rem; background: var(--surface-2); }
.lens-head { margin: 0 0 1rem; }
.lens-head h2 { font-size: 1.15rem; margin: 0 0 .15rem; }
/* Which section a question came from, once the lens has stopped the sections dividing the page. */
.lens-from { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em;
  color: var(--ink-3); margin: 1.1rem 0 .3rem; }
.lens-from:first-of-type { margin-top: .2rem; }

/* A demonstration build says so above everything, in the one colour nothing else on the page
   uses, because a room shown a department name and a score will quote both afterwards. */
.demo-banner { background: #5b2d8e; color: #fff; font-size: .82rem; line-height: 1.35;
  padding: .4rem 1.15rem; border-bottom: 1px solid #3f1f66; }
.demo-banner strong { margin-right: .4rem; text-transform: uppercase; letter-spacing: .06em;
  font-size: .74rem; }
</style>

pe:"gc-arch-rubric",formatVersion:2,id:"gc-ea-assessment",version:"1.0-dan",status:"draft",title:"GC Enterprise Architecture self-assessment",provenance:'Imported by tools/import-rubric.mjs from the TBS GC_EA_Assessment_Tool workbook (6 sheets). Questions, section names, section weights, domain weights and the 0-10 ladder all come from it unchanged. Added by us and marked as such: lifecycle stages, the stage rule on "Defining the Current State" sections, and the routing bands.',dlgBaseUrl:"https://myermcat.github.io/digital-lifecycle-guide",dlgBaseUrlNote:"The guide, on GitHub Pages for now. Each stage points at its own page there.",importWarnings:["Business Architecture: the section weights in the workbook add up to 80%, not 100%. The missing 20 points are shared out across the 6 sections that are there, in proportion, so the domain still scores out of 10. Worth checking whether a section was left out of the export."],scale:{min:0,max:10,anchors:[{value:0,colour:"Black",name:"Absent",label:"No formal architecture. Capabilities are missing, and manual workarounds are the only way to achieve business outcomes."},{value:1,colour:"Dark Red",name:"Critical Gaps",label:"A skeleton exists, but core capabilities (like security or data integrity) are missing. High risk of systemic failure."},{value:2,colour:"Red",name:"Fragmented",label:'Capabilities exist in "silos." They are inconsistent, undocumented, and require constant manual intervention to stay synchronized.'},{value:3,colour:"Orange",name:"Emergent",label:'Core capabilities are present but brittle. The architecture meets the "happy path" but fails under stress or edge cases.'},{value:4,colour:"Orange-Yellow",name:"Defined",label:"The architecture meets basic functional requirements. Documentation exists, but Quality Attributes (scalability, maintainability) are an afterthought."},{value:5,colour:"Yellow",name:"Integrated",label:"This is the Baseline. All desired capabilities are present and connected. The system is stable and performs as expected under normal conditions."},{value:6,colour:"Yellow-Green",name:"Managed",label:"Capabilities are monitored and measured. The architecture can handle predictable growth and has basic fault tolerance."},{value:7,colour:"Green",name:"Scalable & Secure",label:'The architecture is "hardened." It handles bursts in demand effortlessly and has proactive security measures built into the design.'},{value:8,colour:"Dark Green",name:"Agile/Extensible",label:"The architecture is modular. Adding a new desired capability does not require a rewrite; the system is designed to be plugged into and extended."},{value:9,colour:"Blue",name:"Predictive",label:"The architecture uses telemetry and AI/ML to anticipate needs (e.g., auto-scaling before a spike or self-healing before a crash)."},{value:10,colour:"Purple",name:"Symbiotic",label:'The "North Star" state. The architecture and business strategy are one. The system is so flexible it can pivot to entirely new business models with minimal architectural friction.'}]},maturityBands:[{min:9,label:"Leading Practice",detail:"Predictive, self-optimizing, fully aligned with business strategy."},{min:7,label:"Advanced",detail:"Hardened, scalable, and modular. Demonstrably high-quality architecture."},{min:5,label:"Baseline Ready",detail:"Core capabilities present and stable. Meets minimum GC EA expectations."},{min:3,label:"Developing",detail:"Foundational elements exist but architecture is immature and at risk under stress."},{min:0,label:"Critical Risk",detail:"Immediate intervention required. Core capabilities absent or severely compromised."}],maturityBandsNote:"The question set's own reference guide, from its Summary Dashboard sheet.",bands:[{id:"showcase",min:8.5,label:"Showcase",routing:"No board slot needed. TBS may ask to showcase this work.",tone:"good"},{id:"hallpass",min:6,label:"Hall pass",routing:"Suggested: no GC EARB appearance required. Subject to audit sample.",tone:"good"},{id:"routine",min:3 ote:"A second axis, and not a second spine. Every question sits in exactly one of the four architecture domains, and the domains carry the weights that produce the overall score. A question also counts at full weight inside every category it carries, and the categories add up to nothing. TBS named five on 8 September: Security, Privacy, Financial, Accessibility and Official Languages. A question\u2019s domain is not one of them: it is where the question lives and it is never typed into the Categories column. These five are read from the wording of each question and are PROVISIONAL: TBS owns the real assignments, and the Categories column in the workbook is where they come from. Accessibility and Official Languages are thin rather than absent, at three questions and two, which is worth knowing before anybody reads a score for either.",lifecycleStages:[{id:"discovery",label:"Discovery",phase:"Create",dlgPath:"create-discovery",blurb:"Understanding the problem. There may be no current solution to describe yet."},{id:"alpha",label:"Alpha",phase:"Create",dlgPath:"create-alpha",blurb:"Testing whether an approach can work, with real users."},{id:"beta",label:"Beta",phase:"Create",dlgPath:"create-beta",blurb:"Building the real thing in public, at growing scale."},{id:"stabilization",label:"Stabilization",phase:"Live",dlgPath:"live-stabilization",blurb:"In service, settling down. Costs and operations should be known."},{id:"growth",label:"Growth",phase:"Live",dlgPath:"live-growth",blurb:"In service, scaling up."},{id:"maturity",label:"Maturity",phase:"Live",dlgPath:"live-maturity",blurb:"In service, steady state. Everything should be documented and measured."},{id:"sunset",label:"Sunset",phase:"Sunset",dlgPath:"sunset",blurb:"Replacing or retiring. Dependencies and data disposition matter most."}],phases:[{name:"Create",dlgPath:"create",blurb:"Being built, and not in service yet."},{name:"Live",dlgPath:"live",blurb:"In service, with real users."},{name:"Sunset",dlgPath:"suns
